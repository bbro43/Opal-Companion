<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Opal Companion</title>
<meta name="theme-color" content="#0d7f86">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(barlow-condensed-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Nunito Sans';font-style:normal;font-weight:400;font-display:swap;src:url(nunito-sans-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Nunito Sans';font-style:normal;font-weight:600;font-display:swap;src:url(nunito-sans-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Nunito Sans';font-style:normal;font-weight:700;font-display:swap;src:url(nunito-sans-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Nunito Sans';font-style:normal;font-weight:800;font-display:swap;src:url(nunito-sans-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(jetbrains-mono-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(jetbrains-mono-latin-700-normal.woff2) format('woff2')}</style>
<style>
/* Layout idea: a trainer's field device — one scrolling column of instrument cards, a fixed bottom tab bar, opal play-of-color as the only flourish. */
:root {
  --bg: #eef1f0;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #5d6b72;
  --line: #d6dddc;
  --accent: #0d7f86;      /* opal teal */
  --accent-2: #c8457b;    /* opal rose */
  --gold: #b9860f;
  --good: #2f8a4a;
  --warn: #b26a00;
  --bad: #c0392b;
  --soft: #e3ecea;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --opal: linear-gradient(120deg, #6fd3c8 0%, #f2a7c3 35%, #f6d77e 62%, #8fb8f0 100%);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1417; --panel: #182024; --ink: #e7eeec; --muted: #93a3a6; --line: #2a363b;
    --accent: #3cc2c4; --accent-2: #ee7fa9; --gold: #e2b84b; --good: #5cc27a; --warn: #e7a33e; --bad: #f07466; --soft: #1f2a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1417; --panel: #182024; --ink: #e7eeec; --muted: #93a3a6; --line: #2a363b;
  --accent: #3cc2c4; --accent-2: #ee7fa9; --gold: #e2b84b; --good: #5cc27a; --warn: #e7a33e; --bad: #f07466; --soft: #1f2a2e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

#app { max-width: 760px; margin: 0 auto; min-height: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.gem { width: 30px; height: 30px; border-radius: 9px 9px 15px 15px; background: var(--opal); box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18); flex: none; }
.brand-name { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-right { display: flex; align-items: center; gap: 8px; }
.sync { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.sync.on { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 17px; }

#view { padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; outline: none; }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr);
  background: var(--panel); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0; cursor: pointer; color: var(--muted); font-size: 11.5px; font-weight: 700; border-radius: 10px; }
.tabs .ti { font-family: var(--display); font-size: 17px; line-height: 1.1; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--soft); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.flat { background: transparent; border-style: dashed; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h .sub { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.sep { height: 1px; background: var(--line); margin: 2px 0; }
.banner { margin: 12px 16px 0; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--gold) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.rose { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--panel); padding: 6px 11px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); font-weight: 700; }
input[type="text"], input[type="number"], input[type="search"], select, textarea {
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; font-size: 15px; font-weight: 600; }
textarea { min-height: 90px; resize: vertical; font-weight: 400; }
input[type="number"] { font-family: var(--mono); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }

.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 800; letter-spacing: .03em; color: #fff; background: var(--muted); white-space: nowrap; }
.chip.outline { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 800; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); background: color-mix(in srgb, var(--good) 10%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.pill.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* type colors (game-standard hues) */
.t-NORMAL{background:#9a9a78} .t-FIGHTING{background:#b83a2f} .t-FLYING{background:#8f7ed6} .t-POISON{background:#9440a0} .t-GROUND{background:#c4a24f}
.t-ROCK{background:#a99232} .t-BUG{background:#93a51c} .t-GHOST{background:#6a5698} .t-STEEL{background:#8f8fae} .t-FIRE{background:#e2702a}
.t-WATER{background:#5683e3} .t-GRASS{background:#5fa83c} .t-ELECTRIC{background:#d6ad12} .t-PSYCHIC{background:#e6527f} .t-ICE{background:#6cc3c1}
.t-DRAGON{background:#6539ee} .t-DARK{background:#6a5546} .t-FAIRY{background:#d97fa5}

/* trainer stats */
.stat-row { display: grid; grid-template-columns: 96px 1fr 30px; align-items: center; gap: 10px; }
.stat-name { font-weight: 800; font-size: 14px; }
.stat-name small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
.pips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pip { height: 12px; border-radius: 4px; background: var(--soft); border: 1px solid var(--line); }
.pip.on { background: var(--accent); border-color: var(--accent); }
.pip.on.c-contest { background: var(--accent-2); border-color: var(--accent-2); }
.pip.on.c-catch { background: var(--gold); border-color: var(--gold); }
.big { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--soft); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 700; }

/* award grid */
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.award { border: 1px solid var(--line); border-radius: 12px; padding: 9px 8px; background: var(--panel); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; min-height: 76px; }
.award .an { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.05; }
.award .aw { font-size: 11.5px; color: var(--muted); }
.award.on { border-color: transparent; background: var(--opal); color: #17202a; }
.award.on .aw { color: #34424a; }
.award.need { box-shadow: 0 0 0 2px var(--warn); }

/* pokemon */
.mon { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.mon.fainted { opacity: .6; }
.mon-name { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1.05; }
.mon-meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.statline { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; }
.st { background: var(--soft); border-radius: 9px; padding: 5px 4px; text-align: center; }
.st b { display: block; font-family: var(--mono); font-size: 16px; }
.st span { font-size: 10.5px; color: var(--muted); font-weight: 800; letter-spacing: .04em; }
.fr { display: flex; gap: 2px; }
.fr i { width: 9px; height: 9px; border-radius: 50%; background: var(--soft); border: 1px solid var(--line); }
.fr i.on { background: var(--accent-2); border-color: var(--accent-2); }
.mon-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.hpbar { height: 8px; border-radius: 6px; background: var(--soft); overflow: hidden; }
.hpbar > i { display: block; height: 100%; background: var(--good); }
.hpbar.mid > i { background: var(--warn); }
.hpbar.low > i { background: var(--bad); }

/* lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .main { min-width: 0; flex: 1; }
.li .t { font-weight: 800; }
.li .d { font-size: 13px; color: var(--muted); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.qty button { border: 0; background: var(--soft); width: 30px; height: 30px; cursor: pointer; font-weight: 800; }
.qty span { min-width: 32px; text-align: center; font-family: var(--mono); font-weight: 700; }

/* events */
.ev { border-left: 4px solid var(--line); padding: 8px 10px; border-radius: 0 10px 10px 0; background: var(--soft); display: flex; flex-direction: column; gap: 4px; }
.ev.now { border-left-color: var(--good); }
.ev.special { border-left-color: var(--gold); }
.ev.later { border-left-color: var(--line); opacity: .8; }
.ev.missed { border-left-color: var(--bad); opacity: .7; }
.ev.done { border-left-color: var(--accent); }
.ev .t { font-weight: 800; }
.ev .d { font-size: 13.5px; }
details > summary { cursor: pointer; font-weight: 800; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸ "; color: var(--muted); }
details[open] > summary::before { content: "▾ "; }

/* battle */
.arena { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .arena { grid-template-columns: 1fr; } }
.side { border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); }
.side.me { border-top: 4px solid var(--accent); }
.side.foe { border-top: 4px solid var(--accent-2); }
.fighter { border: 1px solid var(--line); border-radius: 12px; padding: 9px; display: flex; flex-direction: column; gap: 6px; }
.fighter.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.foe .fighter.active { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2); }
.fighter .fn { font-weight: 800; }
.bench { display: flex; gap: 5px; flex-wrap: wrap; }
.bench button { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 3px 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.bench button.ko { text-decoration: line-through; opacity: .55; }
.bench button.cur { border-color: var(--accent); color: var(--accent); }
.dice { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.die { min-width: 64px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; background: var(--soft); }
.die b { font-family: var(--mono); font-size: 24px; line-height: 1.1; }
.die span { font-size: 11px; color: var(--muted); font-weight: 800; }
.calc { font-family: var(--mono); font-size: 12.5px; background: var(--soft); border-radius: 10px; padding: 9px 10px; white-space: pre-wrap; line-height: 1.5; }
.result { font-family: var(--display); font-size: 22px; font-weight: 700; }
.result.hit { color: var(--good); } .result.miss { color: var(--bad); }
.blog { max-height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.blog div { padding: 4px 8px; border-radius: 7px; background: var(--soft); }
.order { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.order .o { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.order .o.me { border-color: var(--accent); }
.order .o.foe { border-color: var(--accent-2); }
.order .o.done { opacity: .5; }
.order .o.turn { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.reminder { font-size: 12.5px; border: 1px dashed var(--line); border-radius: 9px; padding: 6px 8px; color: var(--muted); }
.reminder b { color: var(--ink); }

/* journal */
.tl { display: flex; flex-direction: column; gap: 0; }
.tl .e { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 6px 0; }
.tl .dot { width: 12px; height: 12px; border-radius: 50%; margin: 4px 5px; background: var(--muted); }
.tl .dot.badge, .tl .dot.ribbon, .tl .dot.symbol { background: var(--gold); }
.tl .dot.catch, .tl .dot.evolve { background: var(--accent-2); }
.tl .dot.visit { background: var(--accent); }
.tl .dot.win { background: var(--good); }
.tl .dot.loss, .tl .dot.fail { background: var(--bad); }
.story { white-space: pre-wrap; line-height: 1.6; max-width: 65ch; }
.stage-h { font-family: var(--display); font-size: 16px; font-weight: 700; color: var(--accent); margin-top: 8px; }

/* modal sheet */
.scrim { position: fixed; inset: 0; background: rgba(8, 12, 14, .5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--panel); width: 100%; max-width: 760px; max-height: 88%; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 761px) { .scrim { align-items: center; } .sheet { border-radius: 18px; max-width: 620px; } }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: -16px; background: var(--panel); padding: 4px 0; z-index: 1; }
.pick { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.pick button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; border: 0; border-bottom: 1px solid var(--line); background: var(--panel); padding: 8px 10px; cursor: pointer; text-align: left; }
.pick button:hover, .pick button.sel { background: var(--soft); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 60; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; }
#toast.show { opacity: 1; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th, table.t td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.t th { color: var(--muted); font-size: 12px; }
table.t td.n { font-family: var(--mono); text-align: right; }
.scroll-x { overflow-x: auto; }

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="gem" aria-hidden="true"></span>
      <div>
        <div class="brand-name" id="hdr-name">Opal Companion</div>
        <div class="brand-sub" id="hdr-sub">Austra Region</div>
      </div>
    </div>
    <div class="top-right">
      <span class="sync" id="sync-pill" title="Where your save lives">Saved on this device</span>
      <button class="icon-btn" data-act="open-settings" aria-label="Save &amp; settings">⚙</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="trainer"><span class="ti">ID</span><span>Trainer</span></button>
    <button data-tab="pokemon"><span class="ti">◓</span><span>Pokémon</span></button>
    <button data-tab="bag"><span class="ti">▤</span><span>Bag</span></button>
    <button data-tab="map"><span class="ti">⌖</span><span>Map</span></button>
    <button data-tab="battle"><span class="ti">⚔</span><span>Battle</span></button>
    <button data-tab="journal"><span class="ti">✎</span><span>Journal</span></button>

 perimeter around a local shop. You approach an officer who informs you that their has been an attempted robbery at the store and you are told to evacuate the area. After you leave the scene you pass by the Tomba Jewelers on the far side of town, just as the window shatters and two Mafia Grunts and Executive Charlette burst out the front door. Clearly the robbery across town was a distraction. Failure to stop them will allow the mafia to steal enough money to stock their executives each with a Hyper Potion going forward. If you miss this event, Xander will handle and stop the mafia."},{"t":"Tomba Town Gym","r":"","q":{},"d":"Ran by Gym Leader Aya, this gym is known for its use of Pokémon with special talents related to stealth and reality defying illusions. A victory at the gym will award you with the Shuriken Badge."},{"t":"Assistant Hazel’s Research Lab","r":"","q":{},"d":"One of 3 research labs in the Austra Region, this lab is currently being run by Pokémon Research Assistant Hazel. Her research is focused on how the environment impacts and changes certain Pokémon. Research volunteers will receive ₽500, for each research quest they complete. Assistant Hazel’s Research Quests can be found on Page P10."},{"t":"The Shiny Charm","r":"+8 Badges, Complete 1 Focus Area of Research at all 3 Assistants Labs","q":{"badges":{"min":8},"cond":"Complete 1 Focus Area of Research at all 3 Assistants Labs"},"d":"After traveling a long way on your Journey, you run into Assistant Hazel at Tomba Jewelers. She said that her and the other Assistants had wanted to thank you for all the help with their research. She presents you with the Shiny Charm, which is said to help increase the odds of finding Shiny Pokémon."},{"t":"Rival Battle Jayden","r":"6-7 Badges","q":{"badges":{"min":6,"max":7}},"d":"While traveling you encounter Jayden waiting outside of Gym as the Gym Leader is not in at the moment. He challenges you to a 3 on 3 battle to warm up for his 8th Gym battle."}],"wd":[],"tr": died. - Rattata and Alolan Rattata - Sandshrew and Alolan Sandshrew - Meowth, Alolan Meowth, Galarian Meowth (worth extra ₽250) - Growlithe and Austran Growlithe - Ponyta and Galarian Ponyta - Wooper and Paldean Wooper - Branched Evolutions – A branched evolution is where a member of a Pokémon family is able to evolve into one of several different Pokémon. While there are many different Pokémon with branched evolution lines, Assistant Hazels research is focused on those that occur without items but naturally. Capture two different branched evolutions from the same family and donate these Pokémon to the research lab to be cared for and studied. - Lycanroc Dusk, Lycanroc Midday, and Lycanroc Midnight Forms (worth extra ₽500 for all 3) - Toxtricity Amped and Toxtricity Low Key Forms - Silcoon and Cascoon - Ninjask and Shedinja - Gender Differences – Several species of Pokémon have such sever gender differences that the researches have actually denoted Male and Female in the Pokémon’s official name. Assistant Hazel would like to observe and see if these differences have a direct impact on the Pokémon behavior while on the labs nature reserve. Capture both the Male and Female versions of the following Pokémon and donate these Pokémon to the research lab to be cared for and studied. - Nidoran - Meowstic - Indeedee - Oinkologne","m":[["Austran Arcanine",["ELECTRIC"],9,10,8,10,"Transistor","Justified"],["Toxicroak",["POISON","FIGHTING"],9,10,7,9,"Dry Skin","Poison Touch"],["Talonflame",["FIRE","FLYING"],8,8,7,13,"Flame Body","Gale Wings"]]}]},{"n":"Perth Town","k":"town","c":"Green","w":"Normal","t":"Normal","cn":["Route G06"],"poi":[["Pokémon Center",""],["Pokémart",""],["Perth Town Gym",""],["The Z-Shop",""],["Austra Landscaping",""],["Jigglypuff Sweets",""]],"lore":"The smallest town in Green County, Perth Town only receive visitors who are taking the gym challenge or here to visit Serenity Lake. Many travelers skip over this quaint town completely, opting to stop at the Green County Boarding School down the road, that offers lodging to travelers in a secondary building off campus. One of the few attractions in this town is the Z-Shop, a small store front opened by an old man who used to live in the Alola Region.","it":["Silver Powder"],"ev":[{"t":"The Z-Move Tutorial","r":"","q":{},"d":"Behind the counter of this small store stands an old man with quite distinct features compared to the others of this region. He invites you into his store, introducing himself as Oahu, and tells you about how in Alola, there are these bracelets called Z-Rings which let Pokémon use special moves called Z-Moves. The old man gives you a Z-Ring for free just for visiting, stating that the Bracelet is free but the Z-Crystals are going to cost you. Oahu offers you a practice battle to demonstrate how the Z-Ring and Z Crystals work. Once complete, you can visit The Z-Shop to buy Z Crystals for ₽10,000 per Crystal. Information on the Z Crystals can be found on Page R111. Z-Moves: Z-Moves are Powerful one time attack boosts, where the Pokémon draws increased power from a Z-Crystal. A Z-Move will drain a lot of energy from the Z-Crystal and the Pokémon using the move, so each Pokémon can only use one Z-Move per battle. A max of 3 Z-Moves can be used in any one battle. Z-Moves work by rolling 3 damage dice and adding the highest two rolls together. NPCs will use a Z-Move if they have a Pokémon Capable and its HP falls bellow 25%."},{"t":"Perth Town Gym","r":"","q":{},"d":"Ran by Gym Leader Beca & Cace, this gym is known for its use of Double Battles and specialization in Pokémon with gender differences. This gym also has the distinction of being the one of two gyms to use 4 Pokémon, due to the nature of the Double Battle format using two Pokémon at a time per side. A victory at the gym will award you with the Identity Badge."},{"t":"Trade","r":"2-3 Badges","q":{"badges":{"min":2,"max":3}},"d":"At the local Pokémon Center, is a Trainer having trouble with the Local Gym is looking for a Dark or Steel Type Pokémon. Center he is looking to trade his Crabrawler with the Ability Iron Fist and Hidden Ability Anger Point."}],"wd":[],"tr":[{"n":"Oahu","at":"Outside of the Z-Shop (The Z-Move Tutorial)","e":"The Z-Move Tutorial","rw":"₽1,000","o":0,"i":0,"wl":3,"nt":"Z-Move: Icium Z","m":[["Alolan Sandslash",["ICE","STEEL"],8,6,9,7,"Snow Cloak",""]]},{"n":"Gym Leader Beca & Cace","at":"Perth Town Gym","e":"","rw":"₽3,500","o":2,"i":2,"wl":2,"nt":"","m":[["Indeedee Female",["PSYCHIC","NORMAL"],7,8,9,9,"Inner Focus",""],["Indeedee Male",["PSYCHIC","NORMAL"],6,8,8,10,"Own Tempo",""],["Meowstic Female",["PSYCHIC"],8,6,8,11,"Keen Eye",""],["Meowstic Male",["PSYCHIC"],8,6,8,11,"Keen Eye",""],["Nidoqueen",["POISON","GROUND"],9,8,9,8,"Poison Point","Sheer Force"],["Nidoking",["POISON","GROUND"],9,10,8,9,"Poison Point","Sheer Force"]]},{"n":"Trainer Amelia","at":"Pokemon Center (Ace Trainer Battle 1 - 3 Badges)","e":"Ace Trainer Battle 1 - 3 Badges","rw":"","o":3,"i":2,"wl":2,"nt":"","m":[["Austran Totodile",["WATER"],5,6,6,5,"Torrent",""],["Comfey",["FAIRY"],6,6,10,10,"Flower Veil",""],["Swoobat",["PSYCHIC","FLYING"],7,6,6,12,"Unaware",""]]},{"n":"Trainer Henry","at":"Pokemon Center (Ace Trainer Battle 4 - 6 Badges)","e":"Ace Trainer Battle 4 - 6 Badges","rw":"","o":4,"i":2,"wl":3,"nt":"","m":[["Machoke",["FIGHTING"],8,8,7,5,"Guts",""],["Spoink",["PSYCHIC"],6,4,6,6,"Thick Fat",""],["Phantump",["GHOST","GRASS"],5,6,5,4,"Natural Cure",""]]},{"n":"Trainer Harper","at":"Pokemon Center (Ace Trainer Battle +7 Badges)","e":"Ace Trainer Battle +7 Badges","rw":"","o":3,"i":2,"wl":2,"nt":"","m":[["Bellossom",["GRASS"],8,8,10,5,"Chlorophyll",""],["Quagsire",["WATER","GROUND"],10,8,8,4,"Damp",""],["Ursaring",["NORMAL"],9,10,8,6,"Guts",""]]}]},{"n":"Gold Coast City","k":"town","c":"Green","w":"Windy","t":"Normal","cn":["Route G01","Route G08"],"poi":[["Pokémon Center",""],["Pokémart",""],["Gold Coast Contest Hall",""],["Pokémon Daycare Center",""],["Gold Coast City Port",""],["Delibird Presents – Gold Coast City",""]],"lore":"Known as the gateway to Flame County, Gold Coast City is home to the Gold Coast City Port, where a ferry departs daily for Hobart City. The steady ocean breeze keeps the city windy year round, making it a favorite stop for Flying-type Pokémon and the Trainers who chase them. Most visitors come for the Gold Coast Contest Hall or to leave their Pokémon at one of the few Pokémon Daycare Centers in Green County.","it":["Lagging Tail","Pink Bow","Smooth Rock","Soft Sand","Green Scarf"],"ev":[{"t":"Gold Coast Contest Hall","r":"","q":{},"d":"One of 7 Contest Halls in the Austra Region. Gold Coast Hall hosts the following contests:"},{"t":"Beauty Contest","r":"1 Ribbon","q":{"ribbons":{"set":[1]}},"d":"Primary: Beauty, Secondary: Cool & Cute"},{"t":"Cool Contest","r":"0 Ribbons","q":{"ribbons":{"set":[0]}},"d":"Primary: Cool, Secondary: Beauty & Tough"},{"t":"Cute Contest","r":"6 Ribbons","q":{"ribbons":{"set":[6]}},"d":"Primary: Cute, Secondary: Beauty & Clever"},{"t":"Clever Contest","r":"2,3, or 5 Ribbons","q":{"ribbons":{"set":[2,3,5]}},"d":"Primary: Clever, Secondary: Cute & Tough"},{"t":"Tough Contest","r":"4 Ribbons","q":{"ribbons":{"set":[4]}},"d":"Primary: Tough, Secondary: Clever & Cool Roll 3d10 to determine the other three participants in the contest."},{"t":"The Fake Pokémon Daycare Center","r":"1-2 Badges","q":{"badges":{"min":1,"max":2}},"d":"While visiting Gold Coast City, you pass by a line forming outside what appears to be a new business in town. One of the waiting patrons explains that a new daycare facility has opened and is offering a training program that will guarantee amazing returns for any Pokémon left in their care. Unsure about how you feel about letting strangers raise your Pokémon on your behalf, you skip the line and continue with your day. However late that evening as your returning to the Pokémon Center, you see a large truck loading up crates of Pokéballs. You confront the three Mafia Grunts who are loading the truck. Failure to stop them will allow the tons of Pokémon that they can sell on the black market. If you miss this event, no one will stop the mafia and Route G01 eastbound towards Route C03 will be closed for a short amount of time (earn 1 Badge to unlock Route G01 East to Route C03)."},{"t":"Gold Coast Ferry","r":"","q":{},"d":"A local ferry service that takes trainers to Hobart City. Pay ₽500 to travel to Hobart City."},{"t":"Rival Battle Leah","r":"0-2 Badges","q":{"badges":{"min":0,"max":2}},"d":"While traveling you encounter Leah who is waiting for the next Ferry to Hobart City. While she is waiting, she asks if you would be interested in a 2 on 2 battle."}],"wd":[],"tr":[{"n":"Mafia Grunt (M)","at":"Outside Breeding Center (Fake Pokémon Center)","e":"Fake Pokémon Center","rw":"₽250","o":1,"i":0,"wl":0,"nt":"","m":[["Alolan Persian",["DARK"],7,6,6,12,"Fur Coat",""]]},{"n":"Mafia Grunt (F)","at":"Outside Breeding Center (Fake Pokémon Center)","e":"Fake Pokémon Center","rw":"₽250","o":0,"i":1,"wl":0,"nt":"","m":[["Thievul",["DARK"],7,8,8,9,"Unburden",""]]},{"n":"Mafia Grunt Johnny","at":"Outside Breeding Center (Fake Pokémon Center)","e":"Fake Pokémon Center","rw":"₽500","o":1,"i":0,"wl":0,"nt":"","m":[["Mareep",["ELECTRIC"],6,6,4,4,"Static",""],["Gastly",["GHOST","POISON"],3,6,3,8,"Levitate",""]]},{"n":"Rival Leah","at":"Near Gold Coast Ferry (Rival Battle Leah)","e":"Rival Battle Leah","rw":"","o":4,"i":3,"wl":3,"nt":"","m":[["Austran Staryu",["WATER"],3,6,6,9,"Poison Point","Analytic"],["Wooper",["WATER","GROUND"],6,4,4,2,"Damp","Unaware"]]},{"n":"Trainer Charlie","at":"Pokémon Center (Ace Trainer Battle 1 – 3 Badges)","e":"Ace Trainer Battle 1 – 3 Badges","rw":"","o":3,"i":3,"wl":1,"nt":"","m":[["Noibat",["FLYING","DRAGON"],4,4,4,6,"Frisk",""],["Hitmonlee",["FIGHTING"],5,8,8,9,"Limber",""]]},{"n":"Coordinator Ridge","at":"Gold Coast Contest Hall (Ace Trainer Battle 1 – 3 Badges)","e":"Ace Trainer Battle 1 – 3 Badges","rw":"","o":3,"i":0,"wl":0,"nt":"","m":[["Alolan Persian",["DARK"],7,6,6,12,"Fur Coat",""],["Clodsire",["POISON","GROUND"],13,6,8,2,"Poison Point",""]]}]},{"n":"Sydney City","k":"town","c":"Flame","w":"Sunshine","t":"Normal","cn":["Route F02"],"poi":[["Pokémon Center",""],["Pokémart",""],["Sydney City Gym",""],["Sydney Contest Hall",""],["Pokémon Daycare Center",""],["Sydney Zoo",""],["The Rotom Store",""]],"lore":"Sydney City is the home of the only Zoo in the Austra Region. Travelers from all over the world come to visit the Sydney Zoo and to have a chance against the local gym leader Rylan. Sydney also offers a unique opportunity as one of the few cities that has both a gym and a contest hall. The Sydney Contest Hall is the largest in the entire region, and the only contest hall to host multiple contests at a time.","it":["Red Scarf","Poké Snack","Absorb Bulb","Magnet","Poison Barb","Scope Lens"],"ev":[{"t":"Sydney Contest Hall","r":"","q":{},"d":"One of 7 Contest Halls in the Austra Region. Sydney Hall hosts the following contests:"},{"t":"Beauty Contest","r":"1, 2 or 4 Ribbons","q":{"ribbons":{"set":[1,2,4]}},"d":"Primary: Beauty, Secondary: Cool & Cute"},{"t":"Cool Contest","r":"1, 4 or 5 Ribbons","q":{"ribbons":{"set":[1,4,5]}},"d":"Primary: Cool, Secondary: Beauty & Tough"},{"t":"Cute Contest","r":"0, 3 or 6 Ribbons","q":{"ribbons":{"set":[0,3,6]}},"d":"Primary: Cute, Secondary: Beauty & Clever"},{"t":"Clever Contest","r":"0 or 6 Ribbons","q":{"ribbons":{"set":[0,6]}},"d":"Primary: Clever, Secondary: Cute & Tough"},{"t":"Tough Contest","r":"2, 3, or 5 Ribbons","q":{"ribbons":{"set":[2,3,5]}},"d":"Primary: Tough, Secondary: Clever & Cool Roll 3d10 to determine the other three participants in the contest."},{"t":"Sydney Zoo","r":"₽200","q":{"cost":200},"d":"Visit and explore the Sydney Zoo. A unique experience where Pokémon from all over the region can live in peace. Many of the Pokémon in the zoo were actually sent to the Zoo from all over the region for medical treatment as the Zoo also boasts the best Pokémon Care Facility in the entire region. Tickets cost only ₽200 and are available once per session. Select one Pokémon on your team to join you as you explore the zoo."},{"t":"Sydney City Gym","r":"","q":{},"d":"Ran by Gym Leader Rylan, this gym is known for it’s for the wide variety of Pokémon found participating in its gym battles. Being attached to the Sydney Zoo, its Gym Leader Rylan also doubles as the Zoo’s Curator. Rylan frequently updates his team with new Pokémon from the Zoo that wish to join him in battling. A victory at the gym will award you with the Zoo Badge."}],"wd":[],"tr":[{"n":"Gym Leader Rylan","at":"Sindey City Gym","e":"","rw":"₽3,500","o":2,"i":2,"wl":2,"nt":"","m":[["Seel",["WATER"],7,4,6,5,"Thick Fat",""],["Drowzee",["PSYCHIC"],6,4,7,5,"Insomnia",""],["Butterfree",["BUG","FLYING"],6,6,7,7,"Compound Eyes",""],["Copperajah",["STEEL"],13,10,7,3,"Sheer Force","Heavy Metal"],["Hippowdon",["GROUND"],11,10,10,5,"Sand Stream",""],["Ninetales",["FIRE"],8,8,9,10,"Flash Fire","Drought"]]},{"n":"Trainer Lucas","at":"Pokémon Center (Ace Trainer Battle 1 – 3 Badges)","e":"Ace Trainer Battle 1 – 3 Badges","rw":"","o":2,"i":4,"wl":3,"nt":"","m":[["Nickit",["DARK"],4,4,4,5,"Run Away",""],["Rockruff",["ROCK"],5,4,4,6,"Keen Eye",""]]},{"n":"Trainer Elija","at":"Pokémon Center (Ace Trainer Battle 4 – 6 Badges)","e":"Ace Trainer Battle 4 – 6 Badges","rw":"","o":4,"i":3,"wl":3,"nt":"","m":[["Poliwhirl",["WATER"],7,6,6,9,"Water Absorb",""],["Clodsire",["POISON","GROUND"],13,6,8,2,"Poison Point",""],["Shiinotic",["GRASS","FAIRY"],6,6,9,3,"Illuminate",""]]},{"n":"Coordinator Mark","at":"Sydney Contest Hall (Ace Trainer Battle 1 – 3 Badges)","e":"Ace Trainer Battle 1 – 3 Badges","rw":"","o":2,"i":0,"wl":0,"nt":"","m":[["Golem",["ROCK","GROUND"],8,8,10,5,"Rock Head",""],["Glalie",["ICE"],8,8,8,8,"Inner Focus",""]]},{"n":"Coordinator Lucille","at":"Sydney Contest Hall (Ace Trainer Battle 4 – 6 Badges)","e":"Ace Trainer Battle 4 – 6 Badges","rw":"","o":3,"i":0,"wl":0,"nt":"","m":[["Seadra",["WATER"],6,8,7,9,"Sniper","Damp"],["Flaaffy",["ELECTRIC"],7,6,6,5,"Static",""]]}]},{"n":"Melbouboro","k":"town","c":"Flame","w":"Sunshine","t":"Normal","cn":["Route F03","Route F06","Route F08","S.S. Margot"],"poi":[["Pokémon Center",""],["Pokémart",""],["Melbouboro Cruise Ship Port",""],["Melbouboro Candy Shop",""],["Battle Hall",""],["Contest Boutique",""]],"lore":"Melbouboro is one of the most famous tourist cities in all Austra. Travelers come far and wide every year to vacation on the S.S. Margot, to experience the Floating Bridge found on Route F08, and to watch the Grand Festival. Being the home of the final Pokémon Contest every year, Frontier Brain Kyra has worked hard to help the city earn its reputation as the most beautiful city in the region.","it":["Pink Scarf","Polkadot Bow","Love Ball","Luxury Ball"],"ev":[{"t":"Melbouboro Candy Shop","r":"","q":{},"d":"A special candy shop that sells unique consumable items that cannot be found anywhere else in Austra. These treats sell for ₽500 a piece. | Berry Sweet | Love Sweet | Strawberry Sweet | | --- | --- | --- | | Clover Sweet | Ribbon Sweet | Sweet Apple | | Flower Sweet | Star Sweet | Tart Apple |"},{"t":"Melbouboro Cruise Ship Port","r":"","q":{},"d":"The only international cruise port in all of Austra. The S.S. Margot will take passengers who purchase a S.S. Ticket for ₽10,000 on an weeklong Cruise around the Region. Where they can battle tons of other trainers and compete in events, while enjoying a luxurious vacation. Trainers can participate in up to 7 events while on board."},{"t":"The Battle Hall","r":"+8 Badges","q":{"badges":{"min":8}},"d":"Home of The Grand Festival & also one of the Battle Frontier Facilities. Lead by Frontier Brain Kyra, this facility rewards its participants with the Tactics Symbol. All Battle Hall challengers will compete using Kyra’s preferred battle style, Contest Battles."},{"t":"The Spiked Rare Candy","r":"1-3 Badges","q":{"badges":{"min":1,"max":3}},"d":"A small store has popped up in Melbouboro selling Rare Candy. However Pokémon eating the Rare Candy are getting sick and seeing their Friendship be reset. You confront the two sales reps to learn they are Mafia Runts. Defeating them to drive them out of town and shut down the store. If you miss this event, they will eventually be recalled to headquarters."},{"t":"Austra Grand Festival","r":"5 Ribbons, 1 of each type","q":{"ribbons":{"min":5},"eachType":true},"d":"After collecting 5 Ribbons, one from each Contest Type, Coordinators are allowed to compete in the Austra Grand Festival. The Grand Festival is a gathering of the year’s best Coordinators who have come to compete for title and rank of “Top Coordinator.” The Grand Festival is the peak for Pokémon Coordinators in the region. See Page P51 for the Contest Participants and Page R16 for additional rules."}],"wd":[],"tr":[{"n":"Mafia Grunts Butch & Cassidy","at":"Pop-up Store (The Spiked Rare Candy)","e":"The Spiked Rare Candy","rw":"₽250","o":0,"i":1,"wl":1,"nt":"","m":[["Hitmontop",["FIGHTING"],5,6,10,7,"Intimidate",""],["Raticate",["NORMAL"],6,6,7,10,"Guts",""]]},{"n":"Mafia Grunts Johnny","at":"Pop-up Store (The Spiked Rare Candy)","e":"The Spiked Rare Candy","rw":"₽250","o":1,"i":0,"wl":0,"nt":"","m":[["Paras",["BUG","GRASS"],4,6,6,3,"Effect Spore",""],["Fletchling",["NORMAL","FLYING"],5,4,4,7,"Big Pecks",""]]},{"n":"Frontier Brain Kyra","at":"Battle Hall","e":"","rw":"₽3,500","o":3,"i":3,"wl":3,"nt":"","m":[["Flareon",["FIRE"],7,12,9,7,"Flash Fire",""],["Espeon",["PSYCHIC"],7,10,8,11,"Synchronize",""],["Umbreon",["DARK"],10,6,12,7,"Synchronize",""],["Leafeon",["GRASS"],7,8,10,10,"Leaf Guard",""],["Glaceon",["ICE"],7,10,10,7,"Snow Cloak",""],["Sylveon",["FAIRY"],10,8,10,6,"Cute Charm","Pixilate"]]},{"n":"Coordinator Melani","at":"Melbouboro Contest Hall (Ace Trainer Battle 1 – 3 Badges)","e":"Ace Trainer Battle 1 – 3 Badges","rw":"","o":3,"i":0,"wl":0,"nt":"","m":[["Haunter",["GHOST","POISON"],5,8,5,10,"Levitate",""],["Togetic",["FAIRY","FLYING"],6,6,10,4,"Hustle",""]]},{"n":"Coordinator Maddy","at":"Melbouboro Contest Hall (Ace Trainer Battle 4 – 6 Badges)","e":"Ace Trainer Battle 4 – 6 Badges","rw":"","o":3,"i":0,"wl":0,"nt":"","m":[["Simisage",["GRASS"],8,10,6,11,"Gluttony",""],["Heatmor",["FIRE"],9,10,7,7,"Gluttony",""]]}]},{"n":"Adela City","k":"town","c":"Flame","w":"Sunshine","t":"Normal","cn":["Route F01","Route F02","Route F05","Subway"],"poi":[["Pokémon Center",""],["Pokémart",""],["Adela City Gym",""],["Flame County Subway",""],["Adela Theater",""],["Jigglypuff Sweets",""],["Aldea Mining Company",""]],"lore":"Adela City is the smallest official city in the Austra Region. Being a small city helps the promotion of the cities two main attractions. Being the location of both the subway and the most traveled route into Flame County, many people passing through take the opportunity to visit the Pokéshow as well as to stop by the mysterious witchcraft store that doubles as the Adela City Gym.","it":["Wide Lens","Luck Incense","Full Incense","Charcoal","Clear Amulet","Potion","Twisted Spoon"],"ev":[{"t":"Adela City Gym","r":"","q":{},"d":"Ran by Gym Leader U’wa. Hidden in the back room of a small store selling tools for witchcraft lies Adela City Gym. The gym has a unique design as U’wa themed both her gym and her team as a witch using different curses to slow her opponents. Every member of U’wa’s team has an ability that imposes a Status Effect on her opponents."},{"t":"The Pokéshow","r":"₽200","q":{"cost":200},"d":"Adela Theater offers a rare viewing opportunity available for the first time outside Orange Islands. Here viewers can watch a unique show where Pokémon perform onstage and lip-sync to voice actors backstage. Tickets cost only ₽200 and are available once per session. Select one Pokémon on your team to join you as you get to experience this amazing show."},{"t":"Trade (2","r":"","q":{},"d":"3 Badges) – At the local Pokémon Center, is a youngster traveling with his parents on vacation. While stopped at the Pokémon Center he is looking to trade his Phantump with the Ability Natural Cure and Hidden Ability Harvest for either a Ground or Rock Type."},{"t":"The Pickpocket Scammers (5","r":"","q":{},"d":"7 Badges) – There have been reports of people mysteriously having their money, items and even their Pokémon stolen from them while leaving the Subway Station. While passing by you notice a young teenage girl, dramatically fall to the ground and start crying when someone bumped into her. While everyone is distracted by her overreaction, you notice a boy in rags sneak up behind the man and grab something out of his bag. You follow the thief and confront the two con artists about stealing. If you win, they promise to return all the thing they stole, but if you lose, you cannot turn them into the Police. If you are able to stop the duo, you talk to the local police and explain the situation, the police take pity on the poor homeless kids, offering them an opportunity to work of their punishment by volunteering at the Pokémon Center. As a reward the Police offer you a Full Heal."}],"wd":[],"tr":[{"n":"Sis Alexa and Bro Darell","at":"Flame County Subway (The Pickpocket Scammers)","e":"The Pickpocket Scammers","rw":"₽200","o":2,"i":2,"wl":1,"nt":"","m":[["Tinkatuff",["FAIRY","STEEL"],7,6,7,8,"Mold Breaker","Pickpocket"],["Impidimp",["DARK","FAIRY"],5,6,4,5,"Prankster","Pickpocket"]]},{"n":"Gym Leader U’wa","at":"Adela City Gym","e":"","rw":"₽3,500","o":2,"i":2,"wl":2,"nt":"","m":[["Austran Staryu",["WATER"],3,6,6,9,"Poison Point",""],["Austran Sableye",["GHOST","STEEL"],5,8,7,5,"Keen Eye",""],["Alolan Marowak",["FIRE","GHOST"],6,6,10,5,"Cursed Body",""],["Raichu",["ELECTRIC"],6,10,7,11,"Static","Lightning Rod"],["Wigglytuff",["NORMAL","FAIRY"],14,8,5,5,"Cute Charm",""],["Talonflame",["FIRE","FLYING"],8,8,7,13,"Flame Body","Gale Wings"]]},{"n":"Trainer Hudson","at":"Pokémon Center (Ace Trainer Battle 4 - 6 Badges)","e":"Ace Trainer Battle 4 - 6 Badges","rw":"","o":3,"i":3,"wl":3,"nt":"","m":[["Marill",["WATER","FAIRY"],7,4,5,4,"Thick Fat",""],["Austran Sableye",["GHOST","STEEL"],5,8,7,5,"Keen Eye",""],["Glalie",["ICE"],8,8,8,8,"Inner Focus",""]]},{"n":"Trainer Matilda","at":"Pokémon Center (Ace Trainer Battle +7 Badges)","e":"Ace Trainer Battle +7 Badges","rw":"","o":3,"i":2,"wl":2,"nt":"","m":[["Hypno",["PSYCHIC"],9,8,9,7,"Insomnia",""],["Magmortar",["FIRE"],8,12,8,9,"Flame Body",""],["Toxtricity Amped Form",["ELECTRIC","POISON"],8,10,7,8,"Punk Rock",""]]}]},{"n":"Hobart City","k":"town","c":"Flame","w":"Sunshine","t":"Normal","cn":["Route F08"],"poi":[["Pokémon Center",""],["Pokémart",""],["Hobart City Gym",""],["Hobart Beach",""],["Hobart Resort",""],["Assistant Lilly’s Lab",""],["The Mega Shop",""]],"lore":"The most Southern City in Flame County, Hobart City is a prime tourist location for the people of Austra. Featuring a beach known for its soft sand and the largest resort in the Region, Hobart City offers a relaxing experience to those who visit. Due to the number of travelers constantly visiting the city, Assistant Lilly has opened her Pokémon Research Lap here, using space created by former HM moves that Gym Leader Tristan’s Pokémon have access too.","it":["Hard Stone"],"ev":[{"t":"The Mega Tutorial","r":"","q":{},"d":"Located in one of the cities many shopping centers is the is a store with a unique rainbow stone logo on the door. Inside is a young woman named Marie from the Kalos region selling fancy bracelets with these colorful stones in the middle. She tells you that these bracelets contain a powerful stone that with the right complementary stone, can unlock the powers of specific Pokémon. She offers you a Mega Bracelet stating that she felt like you were meant to have it. To convince you to buy her Mega Stones, she offers you a practice battle to demonstrate Mega Evolution. Once complete, you can visit The Mega Shop to buy Mega Stones for ₽10,000 per Stone. Information on the different Mega Stones can be found on Page 109. Mega-Evolution: A special evolution that temporarily evolves specific Pokémon when the holder has the appropriate Mega Stone & the Trainer has a Mega Bracelet. Mega Pokémon gain a temporary evolution increasing their stats significantly. Only one Mega Evolution can be used per battle & the evolution will revert if the Pokémon leaves the battle field NPC’s will Mega Evolve immediately in battle, as soon as their capable Pokémon is out."},{"t":"Hobart City Gym","r":"","q":{},"d":"Ran by Gym Leader Tristan, this gym is known for its use of Pokémon that used to be heavily relied upon for transportation back in the old days. A victory at the gym will award you with the Mule Badge."},{"t":"Assistant Lilly’s Research Lab","r":"","q":{},"d":"One of 3 research labs in the Austra Region, this lab is currently being run by Pokémon Research Assistant Lilly. Her research is focused on how items interact with Pokémon from both a Battle & Evolution perspective. Research volunteers will receive ₽500, for each research quest they complete. Assistant Lilly’s Research Quests can be found on Page P23."},{"t":"Rival Battle Chloe","r":"6-8 Badges","q":{"badges":{"min":6,"max":8}},"d":"While traveling you encounter Chloe leaving Assistant Lilly’s lab, saying she has completed all the Research Quests she was tasked with. She then asks if you would have a 3 on 3 Battle with her."}],"wd":[],"tr":[{"n":"Marie","at":"Outside of The Mega Shop (The Mega Tutorial)","e":"The Mega Tutorial","rw":"₽1000","o":0,"i":0,"wl":3,"nt":"Mega Stone: Beedrillite","m":[["Beedrill",["BUG","POISON"],7,6,6,8,"Swarm",""],["Mega Beedrill",["BUG","POISON"],7,8,6,15,"Adaptability",""]]},{"n":"Gym Leader Tristan","at":"Hobart City Gym","e":"","rw":"₽3,500","o":2,"i":2,"wl":2,"nt":"","m":[["Sandshrew",["GROUND"],5,4,6,4,"Sand Veil",""],["Wooper",["WATER","GROUND"],6,4,4,2,"Water Absorb",""],["Pancham",["FIGHTING"],7,6,6,5,"Iron Fist","Scrappy"],["Breloom",["GRASS","FIGHTING"],6,10,7,7,"Effect Spore",""],["Tropius",["GRASS","FLYING"],10,8,9,6,"Chlorophyll",""],["Gyarados",["WATER","FLYING"],10,10,9,9,"Intimidate",""]]},{"n":"Rival Chloe","at":"Near Assistant Lilly’s Research Lab (Rival Battle Chloe)","e":"Rival Battle Chloe","rw":"","o":4,"i":3,"wl":3,"nt":"","m":[["Austran Ariados",["DARK","POISON"],7,8,7,4,"Dark Aura","Sniper"],["Tropius",["GRASS","FLYING"],10,8,9,6,"Chlorophyll","Harvest"],["Florges",["FAIRY"],8,8,11,8,"Flower Veil","Symbiosis"]]},{"n":"Trainer Henry","at":"Hobary Beach (Ace Trainer Battle +6 Badges)","e":"Ace Trainer Battle +6 Badges","rw":"","o":4,"i":2,"wl":3,"nt":"Assistant Lilly’s Research Quests Below are a list of 14 research quests, composed into 3 focus areas, to help aid in Assistant Lilly’s research for her doctoral thesis. Completing these quests will earn you ₽500 each. - Battle Items – Battle Items are special items that can be given to a Pokémon to hold. When in Battle, these items will offer special abilities to the holder to help assist them. Collect 5 Battle Items with different effects and use them in a Battle. Report your finding to Assistant Lilly. - An item that adds +X to Attack Roll - An item that changes when the holder moves - An item that works for a Pokémon of a specific type - An item that expands the duration of weather - An item that protects the holder in some manner - Evolution Item – An evolution item is an item that allows certain Pokémon to evolve. When a Pokémon evolves, it consumes or breaks the item in the process. Collect Pokémon that evolve using the different evolution item methods and bring them back to the lab so Assistant Lilly can observe their evolutions. - Stone Evolution (worth extra ₽100 for all each different stone evolution, capped at 5 evolutions) - An Item that only works on a specific breed of Pokémon - Evolution using a Linking Cord - Mega Stones – Mega Evolution is a temporary transformation that affects certain Pokémon. In order to Mega Evolve, a Trainer must be holding a Mega Bracelet which features a Key Stone, and the Pokémon must be holding the appropriate Mega Stone. Collect a Mega Bracelet and Mega Stone and use them in Battle. Report your finding to Assistant Lilly - Defeat 5 Trainers only using a single Mega Evolved Pokémon - Have 2 different Pokémon who can Mega Evolve in your Party - Collect 3 or more Mega Stones.","m":[["Machamp",["FIGHTING"],9,10,8,6,"Guts",""],["Kabutops",["ROCK","WATER"],6,10,9,8,"Swift Swim",""],["Grumpig",["PSYCHIC"],8,6,9,8,"Thick Fat",""]]}]},{"n":"Ali Springs","k":"town","c":"Flame","w":"Normal","t":"Normal","cn":["Route F10"],"poi":[["Pokémon Center",""],["Pokémart",""],["Ali Springs Gym",""],["Ali Hot Springs",""],["Ali Springs Museum",""],["Delibird Presents – Ali Springs",""]],"lore":"Names after its famous Hot Springs, Ali Springs was founded when archeologist began digging for Fossils in the area, The original Austran Fossil Lab was built and remained in the town for 10 years until on one dig a hot spring was stuck. Believing that there were no more fossils in the area, the Fossil Lab relocated to Route F04. The original lab has since been converted to a museum, where Gym Leader Raphael, displays fossils discover on expeditions.","it":["Rocky Helmet","Icy Rock","Heat Rock"],"ev":[{"t":"Ali Hot Springs","r":"₽200","q":{"cost":200},"d":"A world renowned hot springs resort that offers one of the most calming and relaxing experiences in the Austra Region. A one hour bath cost only ₽200 and are available once per session. Select one Pokémon on your team to join you as you get some well-deserved rest and relaxation."},{"t":"Ali Springs Gym","r":"","q":{},"d":"Ran by Gym Leader Raphael, this gym is known for its use of Fossil Pokémon that Raphael resurrected as an archeologist in the region. A victory at the gym will award you with the Fossil Badge."},{"t":"The Rare Fossil Heist","r":"1-3 Badges","q":{"badges":{"min":1,"max":3}},"d":"As you enter the Ali Springs Museum for a quick visitor notice the museum curator and your Rival Jayden making a plea to the local police for assistance. If you inquire you will discover that the police are ignoring a clear sign of an attempted burglary from the night before. The museum curator is accusing them of being paid off by the mafia and ask you to stake out the museum and stop them because they believe the mafia will try again tonight. Stake out the museum to defeat three Mafia Grunts and Executive Salvatore. Failure to stop them will allow the mafia to steal the Jaw Fossil to present to the Family Head. If you miss this event, Jayden will handle and stop the mafia."},{"t":"The Fossil Excursion","r":"₽1000","q":{"cost":1000},"d":"A tour to dig sites where Fossils can be found. If two Fossils can be found, flip a coin to determine what you find. After gathering 8 badges you can return to any of the dig sites. - 0 Badges = Armor Fossil & Claw Fossil - 1 Badge = Cover Fossil & Dome Fossil - 2 Badges = Helix Fossil - 3 Badges = Old Amber - 4 Badges = Jaw Fossil - 5 Badges = Plume Fossil - 6 Badges = Root Fossil & Sail - 7 Badges = Skull Fossil"}],"wd":[],"tr":[{"n":"Mafia Grunt (M)","at":"Breaking into the Ali Springs Museum (The Rare Fossil Heist)","e":"The Rare Fossil Heist","rw":"₽250","o":1,"i":0,"wl":0,"nt":"","m":[["Alolan Persian",["DARK"],7,6,6,12,"Fur Coat",""],["Kricketune",["BUG"],8,8,5,7,"Swarm",""]]},{"n":"Mafia Grunt (M)","at":"Breaking into the Ali Springs Museum (The Rare Fossil Heist)","e":"The Rare Fossil Heist","rw":"₽250","o":1,"i":0,"wl":0,"nt":"","m":[["Alolan Raticate",["DARK","NORMAL"],8,6,8,8,"Gluttony",""],["Zubat",["POISON","FLYING"],4,4,4,6,"Inner Focus",""]]},{"n":"Mafia Grunt (F)","at":"Breaking into the Ali Springs Museum (The Rare Fossil Heist)","e":"The Rare Fossil Heist","rw":"₽250","o":0,"i":1,"wl":0,"nt":"","m":[["Thievul",["DARK"],7,8,8,9,"Run Away",""],["Austran Koffing",["POISON","FIRE"],4,6,7,4,"Levitate",""]]},{"n":"Mafia Executive Salvatore","at":"Breaking into the Ali Springs Museum (The Rare Fossil Heist)","e":"The Rare Fossil Heist","rw":"₽1000","o":0,"i":0,"wl":3,"nt":"","m":[["Arbok",["POISON"],6,8,7,8,"Intimidate",""],["Weavile",["DARK","ICE"],7,8,8,13,"Pressure",""],["Ninjask",["BUG","FLYING"],7,8,5,16,"Speed Boost",""],["Pangoro",["FIGHTING","DARK"],10,10,7,6,"Iron Fist","Scrappy"]]},{"n":"Gym Leader Raphael","at":"Ali Springs Gym","e":"","rw":"₽3,500","o":2,"i":2,"wl":2,"nt":"","m":[["Kabuto",["ROCK","WATER"],3,6,7,6,"Swift Swim",""],["Anorith",["ROCK","BUG"],5,6,5,8,"Battle Armor",""],["Kabuto",["ROCK","WATER"],3,6,7,6,"Swift Swim",""],["Bastiodon",["ROCK","STEEL"],6,4,15,3,"Sturdy",""],["Carracosta",["WATER","ROCK"],8,10,10,4,"Solid Rock",""],["Arctozolt",["ELECTRIC","ICE"],9,10,9,6,"Volt Absorb","Slush Rush"]]}]},{"n":"Townsville City","k":"town","c":"Wave","w":"Normal","t":"Normal","cn":["Route W03","Route W04","Route W08","Subway"],"poi":[["Pokémon Center",""],["Pokémart",""],["Townsville Contest Hall",""],["Wave County Subway",""],["The Trade Club",""],["Delibird Presents – Townsville City",""],["Contest Boutique",""]],"lore":"Townsville City is the central most city in Wave County. Right outside the city a fishing port that is responsible for acting all the sea food that is distributed throughout the region. This quiet town doesn’t have much going for outside of its Contest Hall and Subway stop. However do to the amount of travelers passing through the city, The Trade Club offers a variety of opportunities to trade for unique Pokémon.","it":["Ability Patch","Weakness Policy","Luminous Moss","Never-Melt Ice"],"ev":[{"t":"Townsville Contest Hall","r":"","q":{},"d":"One of 7 Contest Halls in the Austra Region. Townsville Hall hosts the following contests:"},{"t":"Beauty Contest","r":"3 or 5 Ribbons","q":{"ribbons":{"set":[3,5]}},"d":"Primary: Beauty, Secondary: Cool & Cute"},{"t":"Cool Contest","r":"2 or 4 Ribbons","q":{"ribbons":{"set":[2,4]}},"d":"Primary: Cool, Secondary: Beauty & Tough"},{"t":"Cute Contest","r":"1 Ribbon","q":{"ribbons":{"set":[1]}},"d":"Primary: Cute, Secondary: Beauty & Clever"},{"t":"Clever Contest","r":"0 Ribbons","q":{"ribbons":{"set":[0]}},"d":"Primary: Clever, Secondary: Cute & Tough"},{"t":"Tough Contest","r":"6 Ribbons","q":{"ribbons":{"set":[6]}},"d":"Primary: Tough, Secondary: Clever & Cool Roll 3d10 to determine the other three participants in the contest."},{"t":"Trade (0","r":"","q":{},"d":"2 Badges) – At the local Trade Club, is a traveler from Paldea an Austran Regional Form Pokémon. He is looking to trade his Paldean Wooper with the Ability Water Absorb and Hidden Ability Unaware."},{"t":"Trade (3","r":"","q":{},"d":"4 Badges) – At the local Trade Club, is a bird tamer is looking to add a new flying type to replace a duplicate on her team. She is looking to trade his Wattrel with the Ability Volt Absorb for a Flying Type."},{"t":"Gift Pokémon (5","r":"","q":{},"d":"6 Badges) – At the local Trade Club, is an old man is looking to rehome a Fidough with the Ability Own Tempo. He is just to old to take care of a young pup again, and needs someone willing to care for it."},{"t":"Trade","r":"+7 Badges","q":{"badges":{"min":7}},"d":"At the local Trade Club, is a former biker is looking for a Water Type so he can take up surfing. He’s offering a Cyclizar with the Ability Regenerator."}],"wd":[],"tr":[]},{"n":"Cairn Town","k":"town","c":"Wave","w":"Rain","t":"Wet","cn":["Route W02","Route W09"],"poi":[["Pokémon Center",""],["Pokémart",""],["Battle Factory",""],["Assistant Fern’s Lab",""],["Factory Daycare",""],["Jigglypuff Sweets",""]],"lore":"Known as the hardest working town in the Austra region, Cairn town is home to the Battle Factory, a Frontier Facility that doubles as the largest manufacturing facility in the region. Frontier Brain Andre is known for being one of the savviest businessmen in the region. Strong and hardworking, he has recruited Assistant Fern, to run the Factory Daycare, a side facility connected to both the Battle Factory and her lab where she can both care for and study the Pokémon of the factory workers.","it":["Ability Capsule","Ability Shield","Assault Vest","Heavy-Duty Boots","Black Belt"],"ev":[{"t":"Assistant Fern’s Research Lab","r":"","q":{},"d":"One of 3 research labs in the Austra Region, this lab is currently being run by Pokémon Research Assistant Fern. Her research is focused the vast multitude of Pokémon Abilities, trying to understand the relationships between different Pokémon through shared traits like abilities. Research volunteers will receive ₽500, for each research quest they complete. Assistant Fern’s Research Quests can be found on Page P29."},{"t":"The Supply Chain Disruption","r":"3-5 Badges","q":{"badges":{"min":3,"max":5}},"d":"A large shipment of medical equipment replacement parts are due to ship out to the different Pokémon Centers across the region. The new parts are to replace a faulty part that is malfunctioning in the healing equipment. The Mafia is looking to stop this shipment, to force trainers to their illegal care facilities, where they can charge a significant premium to heal and revive Pokémon. Stop the Mafia Grunts and Officer Dominick to ensure the parts get to the Pokémon Centers on time. Failure to stop them will prevent the use of Pokémon Centers for a short period of time. In their place Mafia Centers will pop up, charging ₽500 per Pokémon that needs restored. It will take approximately the amount of time to earn 2 Badges before a new shipment of parts can be produced. If you miss this event, Leah will have stopped the mafia."},{"t":"The Battle Factory","r":"+8 Badges","q":{"badges":{"min":8}},"d":"A massive industrial facility, the Battle Factory is responsible for a mass amount of Austra’s manufacturing exports, including automobiles, construction equipment and supplied, as well as medical equipment, if its was built in Austra, its more than likely built in the Battle Factory. Lead by Frontier Brain Andre, this facility rewards its participants with the Brave Symbol. All Battle Factory challengers will compete using Andre’s preferred battle style, No Substitutions."}],"wd":[],"tr":[{"n":"Mafia Grunt (M)","at":"Outside Battle Factory (The Supply Chain Disruption)","e":"The Supply Chain Disruption","rw":"₽250","o":1,"i":0,"wl":0,"nt":"","m":[["Alolan Persian",["DARK"],7,6,6,12,"Fur Coat",""]]},{"n":"Mafia Grunt (F)","at":"Outside Battle Factory (The Supply Chain Disruption)","e":"The Supply Chain Disruption","rw":"₽250","o":0,"i":1,"wl":0,"nt":"","m":[["Stunky",["POISON","DARK"],7,6,4,8,"Aftermath",""]]},{"n":"Mafia Officer Dominick","at":"Outside Battle Factory (The Supply Chain Disruption)","e":"The Supply Chain Disruption","rw":"₽500","o":0,"i":1,"wl":1,"nt":"","m":[["Alolan Raticate",["DARK","NORMAL"],8,6,8,8,"Gluttony",""],["Nidorino",["POISON"],7,6,6,7,"Poison Point",""],["Swoobat",["PSYCHIC","FLYING"],7,6,6,12,"Unaware",""]]},{"n":"Frontier Brain Andre","at":"Battle Factory","e":"","rw":"₽3,500","o":3,"i":3,"wl":3,"nt":"","m":[["Magnezone",["ELECTRIC","STEEL"],7,10,10,6,"Magnet Pull",""],["Machamp",["FIGHTING"],9,10,8,6,"Guts",""],["Scizor",["BUG","STEEL"],7,10,9,7,"Technician",""],["Tinkaton",["FAIRY","STEEL"],9,8,9,10,"Mold Breaker",""],["Excadrill",["GROUND","STEEL"],11,10,6,9,"Sand Force","Mold Breaker"],["Conkeldurr",["FIGHTING"],11,10,8,5,"Sheer Force","Iron Fist"]]},{"n":"Trainer Ella","at":"Pokemon Center (Ace Trainer Battle 1- 3 Badges)","e":"Ace Trainer Battle 1- 3 Badges","rw":"","o":3,"i":1,"wl":2,"nt":"Assistant Fern’s Research Quests Below are a list of 15 research quests, composed into 3 focus areas, to help aid in Assistant Fern’s research for her doctoral thesis. Completing these quests will earn you ₽500 each. - Common Abilities – There are several abilities that are commonly found among a variety of Pokémon. Capture up to five, but at least two different species of Pokémon with one of the following abilities and donate these Pokémon to the research lab to be cared for and studied. - Sturdy - Intimidate - Swift Swim - Inner Focus - Thick Fat - Unique Abilities – While these abilities may be more common in other regions, in the Austra Region, there are only one species of Pokémon with these unique abilities. Collect up to 5 Pokémon with unique abilities and donate these Pokémon to the research lab to be cared for and studied. - Field Abilities – Some Pokémon have special abilities that have use outside of battle, usually in the form of modifying wild encounters or finding new items. Collect up to 5 Pokémon with unique abilities and donate these Pokémon to the research lab to be cared for and studied.","m":[["Krabby",["WATER"],3,6,6,5,"Hyper Cutter",""],["Austran Spinarak",["DARK","POISON"],4,6,4,3,"Dark Aura",""],["Skiddo",["GRASS"],7,6,5,6,"Sap Sipper",""]]}]},{"n":"Snowshine City","k":"town","c":"Wave","w":"Sunshine","t":"Snowy","cn":["Route W07","Snowshine Port"],"poi":[["Pokémon Center",""],["Pokémart",""],["Snowshine City Gym",""],["Austra Meteorology Center",""]],"lore":"The northern most city in the Austra Region, Snowshine City is always coated in a clean layer of snow that reflects the sunlight all over the city. Located in Snowshine City is the Austra Meteorology Center, where Gym Leaders Ava & Ned, work as the lead Meteorologist and Cinematographer for the Austra Weather station. Just south of the city on Route W07 Sunshine Ski Resort and just off to the west is Snowshine Port, where travelers can access the Riverboat Casino to travel down the Barrier River to Mirage Port.","it":["Safety Goggles","Sharp Beak","Utility Umbrella"],"ev":[{"t":"Snowshine City Gym","r":"","q":{},"d":"Ran by Gym Leaders Ava & Ned, this gym is known for its use of Weather Pokémon. All Snowshine City Gym challengers will compete using Ava & Ned’s preferred battle style, Double Battles. This gym also has the distinction of being the one of two gyms to use 4 Pokémon, due to the nature of the Double Battle format using two Pokémon at a time per side. Ava uses two Castforms, one will always be active on the field until they have been defeated. A victory at the gym will award you with the Radar Badge."},{"t":"The Castform Blizzard","r":"1-3 Badges","q":{"badges":{"min":1,"max":3}},"d":"A blizzard has struck Snowshine City and one of the Castform used by the Meteorology has disappeared. An intern had taken a few of the Castform out to work with them on changing form, unaware of the incoming blizzard. Using a Pokémon capable of changing the weather, help the intern find the missing Castform. To find the Castform you must have a Pokémon with a weather changing ability or held item in your Party, to change the weather and cause the Castform to change forms. Meteorologist Ava will gift you the lost Castform as a gift as it will take a liking to the new weather you created."},{"t":"Feeling the Weather in my Bones","r":"₽2,000","q":{"cost":2000},"d":"An elderly lady in town is complaining about the weather making her bones ache. When you ask her what’s wrong she says when she used to be a trainer, she had Pokémon that could change the weather, but her Pokémon have all moved on. She says she has some old weather changing items and will sell you one of them for money to spend on the Riverboat Casino. In exchange she will let you choose one Weather Orb to have: Sunshine Orb, Rain Orb, Hail Orb, Sandstorm Orb, Windy Orb, Fog Orb."},{"t":"Rival Battle Xander","r":"6-8 Badges","q":{"badges":{"min":6,"max":8}},"d":"While traveling you encounter Xander who has informed you that he has just beaten his 8th Gym and is ready for the League. He then challenges you to a 3 on 3 battle."}],"wd":[],"tr":[{"n":"Gym Leader Ava & Ned","at":"Snowshine City Gym","e":"","rw":"₽3,500","o":2,"i":2,"wl":2,"nt":"","m":[["Vulpix",["FIRE"],4,4,5,7,"Flash Fire",""],["Lotad",["WATER","GRASS"],4,4,4,3,"Rain Dish",""],["Castform",["NORMAL"],7,8,7,7,"Forecast",""],["Castform",["NORMAL"],7,8,7, launched off a cliff. His Golbat forced its way out of its Pokéball and evolved into a Crobat in order to save him. After that he left the gang and started training Pokémon that focused on Friendship Evolutions. A victory at the gym will award you with the Friendship Badge."},{"t":"Attack on the Construction Site","r":"2-4 Badges","q":{"badges":{"min":2,"max":4}},"d":"A large building is being erected in Waga Town. While construction is going on, the Pokémon being used for the job are being stored in a trailer at the site. One night, the alarm goes off and several Mafia Grunts are trying to steal the Conkeldurr Pokéballs used by the company. Stop them to prevent them from stealing the Pokéball. If you miss this event or fail to stop the Mafia, the event “Trainer Tower” will be delayed by for a significant amount of time, (the event requirement will now be +8 Badges)."},{"t":"Trainer Tower","r":"+4 Badges","q":{"badges":{"min":4}},"d":"A large tower constructed in Waga Town. Built by Gym Leader Bruce, the hope was that by adding this tower will become the first step in Waga Town evolving into Waga City. Trainer Tower is a unique challenge where Trainers from around the region can gather and challenge each other as they try to reach the top floor. No Medicine items can be used during battles at Trainer Tower. The goal is to defeat at many trainers as possible before you parties HP is depleted. Pokémon will not recover HP between battles. Held Items that restore HP can be used. Defeating all 8 Trainers, in the order of the Floor Number they appear on, will reward the player two possible rewards. If the trainer used any Medicine Item, they will get a Nugget. If the Trainer used no Medicine Items, they will get a Big Nugget."}],"wd":[],"tr":[{"n":"Mafia Grunt (M)","at":"At Construction Site (Center Attack on the Construction Site)","e":"Center Attack on the Construction Site","rw":"₽250","o":1,"i":0,"wl":0,"nt":"","m":[["Beedrill",["BUG","POISON"],7,6,6,8,"Swarm",""]]},{ :"},{"t":"Beauty Contest","r":"4 Ribbons","q":{"ribbons":{"set":[4]}},"d":"Primary: Beauty, Secondary: Cool & Cute"},{"t":"Cool Contest","r":"3 Ribbons","q":{"ribbons":{"set":[3]}},"d":"Primary: Cool, Secondary: Beauty & Tough"},{"t":"Cute Contest","r":"2 or 6 Ribbons","q":{"ribbons":{"set":[2,6]}},"d":"Primary: Cute, Secondary: Beauty & Clever"},{"t":"Clever Contest","r":"1 or 5 Ribbons","q":{"ribbons":{"set":[1,5]}},"d":"Primary: Clever, Secondary: Cute & Tough"},{"t":"Tough Contest","r":"0 Ribbons","q":{"ribbons":{"set":[0]}},"d":"Primary: Tough, Secondary: Clever & Cool Roll 3d10 to determine the other three participants in the contest."},{"t":"Bris City Gym","r":"","q":{},"d":"Ran by Gym Leader James, the Bris City gym also doubles as the Fire Station Training Academy. Those who want to become fire fighters attend this Academy to learn the skills needed for the job. A retired fire chief, James uses Pokémon ideal for firefighting and rescue operations. A victory at the gym will award you with the Rescue Badge."},{"t":"The Battle Station","r":"+8 Badges","q":{"badges":{"min":8}},"d":"Much like the Bris City Gym doubles as the Fire Training Academy, the Battle Station Frontier Facility also doubles as the Police Training Academy. Leady by the strict Frontier Brain Lawrence, this facility rewards its participants with the Ability Symbol. Lawrence is strict about being able to succeed on one’s own merit, as such, no items can be used in battle at the Battle Station."},{"t":"The Test Fire","r":"4-5 Badges","q":{"badges":{"min":4,"max":5}},"d":"While exploring the city you approach a building that appears to be on fire. You hear what sounds like a child crying in the building. If you have a Water Type or Fire-Type Pokémon with a Total Base Power of 35 or more, you can use them to rescue the child. Bris City Gym Leader James sees your heroics and awards you the Rescue Badge, but offers to battle you still, if you desire."}],"wd":[],"tr":[{"n":"Gym Leader James","at":"B
