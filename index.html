      ${L.wd.length ? `<div class="row"><button class="btn primary" data-act="encounter">Look for wild Pokémon</button><button class="btn" data-act="wild-pick">Pick a wild Pokémon</button></div>` : ""}
      <div class="row"><button class="btn" data-act="pvp">Battle another player / custom team</button></div>
    </div>
  </section>
  ${vQuickCalc()}`;
}
function calcFighter(ref, side) {
  if (!ref) return null;
  const [k, v] = [ref.slice(0, 1), ref.slice(2)];
  if (k === "m") { const m = S.mons.find((x) => x.id === v); return m ? Object.assign(fighterFromMon(m), { side }) : null; }
  if (k === "w") { const w = LOCMAP.get(S.loc).wd[+v]; return w ? makeFighter({ name: w[1], sp: w[1], types: w[2], hp: w[3], atk: w[4], def: w[5], spd: w[6], ability: w[7], abilities: [w[7], w[8], w[9]].filter(Boolean) }, side) : null; }
  const d = dexFind(v); return d ? makeFighter({ name: d.name, sp: d.name, types: d.types, hp: d.hp, atk: d.atk, def: d.def, spd: d.spd, ability: d.ab1, abilities: [d.ab1, d.ab2, d.hidden].filter(Boolean) }, side) : null;
}
function refOptions(sel, withWild) {
  const L = LOCMAP.get(S.loc);
  const mine = S.mons.map((m) => `<option value="m:${m.id}" ${sel === "m:" + m.id ? "selected" : ""}>${esc(monName(m))} (yours)</option>`).join("");
  const wild = withWild ? L.wd.map((w, i) => `<option value="w:${i}" ${sel === "w:" + i ? "selected" : ""}>${esc(w[1])} (wild here)</option>`).join("") : "";
  const dexSel = sel && sel.startsWith("d:") ? `<option value="${esc(sel)}" selected>${esc(sel.slice(2))} (Pokédex)</option>` : "";
  return mine + wild + dexSel + `<option value="__dex">Pick from the Pokédex…</option>`;
}
function vQuickCalc() {
  const c = UI.calc;
  const B = { sides: { me: { trainer: myTrainer(), active: [], mons: [] }, foe: { trainer: { hasTrainer: c.dObd != null && c.dHas, obedience: +c.dObd || 0, intuition: +c.dInt || 0, will: +c.dWill || 0 }, active: [], mons: [] } }, weather: c.w, terrain: c.t, round: 1 };
  const A = calcFighter(c.a, "me"), D = calcFighter(c.d, "foe");
  let out = `<div class="empty">Pick two Pokémon.</div>`;
  if (A && D) {
    B.sides.me.mons = [A]; B.sides.me.active = [0]; B.sides.foe.mons = [D]; B.sides.foe.active = [0];
    const row = (att, def) => att.types.concat(ifx(att).extraType ? [ifx(att).extraType] : []).map((t) => {
      const o = attackOdds(B, att, def, t);
      return `<tr><td>${typeChip(t)}</td><td class="n">${o.need}+</td><td class="n">${Math.round(o.hitPct * 100)}%</td><td class="n">×${o.mult}</td><td class="n">${o.min}–${o.max}</td><td class="n">${o.avg.toFixed(1)}</td><td class="n">${Math.round(o.koPct * 100)}%</td></tr>`;
    }).join("");
    const head = `<thead><tr><th>Type</th><th class="n">Needs</th><th class="n">Hit</th><th class="n">Mult</th><th class="n">Damage</th><th class="n">Avg</th><th class="n">KO</th></tr></thead>`;
    out = `<div><b>${esc(A.name)}</b> attacking <b>${esc(D.name)}</b> (${D.hp} HP)</div><div class="scroll-x"><table class="t">${head}<tbody>${row(A, D)}</tbody></table></div>
      <div><b>${esc(D.name)}</b> attacking <b>${esc(A.name)}</b> (${A.hp} HP)</div><div class="scroll-x"><table class="t">${head}<tbody>${row(D, A)}</tbody></table></div>
      <div class="tiny muted">Speed: ${esc(A.name)} ${speedOf(B, A).v} vs ${esc(D.name)} ${speedOf(B, D).v}. Uses your trainer stats on your side. KO is the chance to knock out from full HP in one attack.</div>`;
  }
  return `<section class="card"><div class="card-h"><h2>Quick calculator</h2><span class="sub">Odds for one attack, either way</span></div>
    <div class="grid2">
      <label class="f" for="qc-a">Your side<select id="qc-a" data-change="qc-a">${refOptions(c.a, false)}</select></label>
      <label class="f" for="qc-d">Opponent<select id="qc-d" data-change="qc-d">${refOptions(c.d, true)}</select></label>
      <label class="f" for="qc-w">Weather<select id="qc-w" data-change="qc-w">${WEATHERS.map((w) => `<option ${w === c.w ? "selected" : ""}>${w}</option>`).join("")}</select></label>
      <label class="f" for="qc-t">Terrain<select id="qc-t" data-change="qc-t">${TERRAINS.map((w) => `<option ${w === c.t ? "selected" : ""}>${w}</option>`).join("")}</select></label>
    </div>
    <div class="row small"><label class="check"><input type="checkbox" data-change="qc-has" ${c.dHas ? "checked" : ""}> Opponent has a trainer</label>
      ${c.dHas ? `<label class="f" style="width:84px">Obedience<input type="number" min="0" max="4" value="${c.dObd || 0}" data-change="qc-o"></label><label class="f" style="width:84px">Intuition<input type="number" min="0" max="4" value="${c.dInt || 0}" data-change="qc-i"></label><label class="f" style="width:84px">Will<input type="number" min="0" max="4" value="${c.dWill || 0}" data-change="qc-wl"></label>` : ""}</div>
    ${out}</section>`;
}

/* ============================================================
   Modals, toasts, actions
   ============================================================ */
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }
let MODAL = null;
function modal(title, body, onMount) {
  $("#modal-root").innerHTML = `<div class="scrim" data-act="modal-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn" data-act="modal-close" aria-label="Close">✕</button></div><div class="stack" id="modal-body">${body}</div></div></div>`;
  MODAL = { title };
  if (onMount) onMount($("#modal-body"));
  const first = $("#modal-body input, #modal-body select, #modal-body button"); if (first && first.tagName !== "BUTTON") first.focus();
}
function closeModal() { $("#modal-root").innerHTML = ""; MODAL = null; }
function commit(msg) { save(); render(); if (msg) toast(msg); }

/* ---------- pickers ---------- */
function dexPicker(title, onPick, filter) {
  const list = (q) => DEX.filter((d) => (!filter || filter(d)) && (!q || d.name.toLowerCase().includes(q.toLowerCase()) || d.types.some((t) => t.toLowerCase() === q.toLowerCase()))).slice(0, 80)
    .map((d) => `<button data-pick="${esc(d.name)}"><span><b>${esc(d.name)}</b> <span class="tiny muted">#${d.num}</span></span><span class="row">${d.types.map(typeChip).join(" ")}<span class="num small">${d.total}</span></span></button>`).join("") || `<div class="empty">No match.</div>`;
  modal(title, `<input type="search" id="dp-q" placeholder="Search name or type" autocomplete="off"><div class="pick" id="dp-list">${list("")}</div>`, (el) => {
    $("#dp-q", el).addEventListener("input", (e) => ($("#dp-list", el).innerHTML = list(e.target.value)));
    $("#dp-list", el).addEventListener("click", (e) => { const b = e.target.closest("[data-pick]"); if (b) onPick(b.dataset.pick); });
  });
}
function itemPicker(title, onPick, filter) {
  const list = (q) => ITEMS.filter((i) => (!filter || filter(i)) && (!q || i.name.toLowerCase().includes(q.toLowerCase()) || i.cat.toLowerCase().includes(q.toLowerCase()))).slice(0, 80)
    .map((i) => `<button data-pick="${esc(i.name)}"><span><b>${esc(i.name)}</b><br><span class="tiny muted">${esc(i.desc)}</span></span><span class="pill">${esc(i.cat)}</span></button>`).join("");
  modal(title, `<input type="search" id="ip-q" placeholder="Search items or a category" autocomplete="off"><div class="pick" id="ip-list">${list("")}</div>`, (el) => {
    const q = $("#ip-q", el);
    q.addEventListener("input", (e) => ($("#ip-list", el).innerHTML = list(e.target.value) + (e.target.value ? `<button data-pick="${esc(e.target.value)}" data-custom="1"><span>Add “${esc(e.target.value)}” as a custom item</span></button>` : "")));
    $("#ip-list", el).addEventListener("click", (e) => { const b = e.target.closest("[data-pick]"); if (b) onPick(b.dataset.pick); });
  });
}
function monPicker(title, onPick, filter) {
  const ms = S.mons.filter((m) => !filter || filter(m));
  modal(title, ms.length ? `<div class="pick">${ms.map((m) => `<button data-pick="${m.id}"><span><b>${esc(monName(m))}</b> <span class="tiny muted">${esc(m.sp)} · ${S.party.includes(m.id) ? "Party" : "Box"}</span></span><span class="num small">${m.hp == null ? monStats(m).hp : m.hp}/${monStats(m).hp} HP</span></button>`).join("")}</div>` : `<div class="empty">No Pokémon to choose.</div>`, (el) => {
    el.addEventListener("click", (e) => { const b = e.target.closest("[data-pick]"); if (b) onPick(S.mons.find((m) => m.id === b.dataset.pick)); });
  });
}

/* ---------- create a pokémon ---------- */
function newMon(sp, o = {}) {
  const d = dexFind(sp);
  const slot = d && d.ab2 ? (coin() === "Heads" ? 2 : 1) : 1;
  const genderless = !d || /Male|Female|♂|♀/.test(d.name);
  const m = {
    id: uid(), sp: d ? d.name : sp, nick: "", gender: o.gender != null ? o.gender : (genderless ? (/Female|♀/.test(sp) ? "F" : /Male|♂/.test(sp) ? "M" : "") : coin() === "Tails" ? "F" : "M"),
    nature: o.nature || rollNature(), slot: o.slot || slot, hasHidden: o.hasHidden != null ? o.hasHidden : !!(d && d.hidden && rnd(20) >= 16), ab: "",
    shiny: !!o.shiny, mark: o.mark || "", fr: o.fr || 0, star: false, item: "", hp: null, status: "", vit: { hp: 0, atk: 0, def: 0, spd: 0 }, vitCount: {},
    cond: { cool: 0, beauty: 0, cute: 0, clever: 0, tough: 0 }, sheen: 0, caught: { loc: S.loc, ball: o.ball || "", ts: Date.now(), lvl: level() }, note: "",
  };
  m.ab = o.ab || monAbilities(m)[0] || "";
  return m;
}
function addMon(m) {
  S.mons.push(m);
  if (S.party.length < 6) S.party.push(m.id);
}

/* ---------- awards ---------- */
function awardMeta(id) {
  const kind = id.split(":")[0];
  if (kind === "gym") { const g = GYMS.find((x) => x.id === id); return { kind, title: g.badge, sub: `Gym Leader ${g.leader}, ${g.town}`, pts: 2 }; }
  if (kind === "sym") { const f = FRONTIER.find((x) => x.id === id); return { kind, title: f.symbol, sub: `Frontier Brain ${f.brain}, ${f.facility} (${f.town})`, pts: 2 }; }
  const h = HALLS.find((x) => x.id === id); return { kind, title: h.hall, sub: "One Ribbon from this hall", pts: 3, hall: h };
}
function openAward(id, fromBattle, presetType) {
  const meta = awardMeta(id);
  const a = S.awards[id] || { on: false, alloc: [] };
  const draft = { on: true, alloc: (a.alloc || []).slice(), type: a.type || presetType || "", fr: {} };
  const allowed = allowedStats(meta.kind);
  const st = statsAll();
  (a.alloc || []).forEach((k) => st[k]--);
  const room = () => awardRoom({ ...a, kind: meta.kind, alloc: draft.alloc });
  const body = () => {
    const roomN = room();
    return `<div class="muted">${esc(meta.sub)}</div>
    ${meta.kind === "hall" ? `<label class="f" for="aw-type">Ribbon type<select id="aw-type"><option value="">Choose…</option>${RIBBON_TYPES.map((t) => `<option ${draft.type === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>` : ""}
    <div><div class="tiny muted" style="font-weight:800;margin-bottom:6px">ASSIGN ${roomN} POINT${roomN === 1 ? "" : "S"} — EACH TO A DIFFERENT STAT${roomN < meta.pts ? ` (the 20-point cap leaves ${roomN})` : ""}</div>
    <div class="grid2">${STATS.map((s) => { const ok = allowed.includes(s.k); const on = draft.alloc.includes(s.k); const full = st[s.k] >= STAT_MAX; return `<button class="btn ${on ? "primary" : ""}" data-aw="${s.k}" ${!ok || (full && !on) ? "disabled" : ""}>${s.n} <span class="num">${st[s.k] + (on ? 1 : 0)}/4</span></button>`; }).join("")}</div></div>
    ${!a.on && partyMons().length ? `<div class="stack"><div class="tiny muted" style="font-weight:800">FRIENDSHIP +1 FOR POKÉMON THAT TOOK PART</div>${partyMons().map((m) => `<label class="check"><input type="checkbox" class="aw-fr" value="${m.id}" ${fromBattle && fromBattle.includes(m.id) ? "checked" : ""}> ${esc(monName(m))} (${m.fr})</label>`).join("")}</div>` : ""}
    <div class="row"><button class="btn primary" data-aw-save>${a.on ? "Save" : "Earn " + esc(meta.title)}</button>${a.on ? `<button class="btn danger ghost" data-aw-remove>Remove this award</button>` : ""}</div>`;
  };
  modal(meta.title, body(), (el) => {
    const rerender = () => { el.innerHTML = body(); };
    el.addEventListener("change", (e) => { if (e.target.id === "aw-type") draft.type = e.target.value; });
    el.addEventListener("click", (e) => {
      const b = e.target.closest("[data-aw]");
      if (b) { const k = b.dataset.aw; const i = draft.alloc.indexOf(k); if (i >= 0) draft.alloc.splice(i, 1); else if (draft.alloc.length < room()) draft.alloc.push(k); else toast(`Only ${room()} point${room() === 1 ? "" : "s"} for this one.`); rerender(); return; }
      if (e.target.closest("[data-aw-save]")) {
        if (meta.kind === "hall" && !draft.type) { toast("Pick the Ribbon type first."); return; }
        const first = !a.on;
        const frIds = [...el.querySelectorAll(".aw-fr:checked")].map((x) => x.value);
        S.awards[id] = { on: true, alloc: draft.alloc, type: draft.type, at: a.at || Date.now() };
        if (first) {
          frIds.forEach((mid) => { const m = S.mons.find((x) => x.id === mid); if (m) m.fr = Math.min(10, m.fr + 1); });
          log(meta.kind === "gym" ? "badge" : meta.kind === "sym" ? "symbol" : "ribbon", meta.kind === "hall" ? `Won a ${draft.type} Ribbon at ${meta.title}.` : `Earned the ${meta.title}${meta.kind === "gym" ? " from " + meta.sub.replace(/^Gym Leader /, "") : ""}.`);
        }
        closeModal(); commit(first ? `${meta.title} earned` : "Saved");
      }
      if (e.target.closest("[data-aw-remove]")) { delete S.awards[id]; closeModal(); commit("Award removed"); }
    });
  });
}

/* ---------- pokémon detail ---------- */
function openMon(id) {
  const m = S.mons.find((x) => x.id === id); if (!m) return;
  const s = monStats(m), d = s.dex;
  const mu = matchups(s.types);
  const evos = evolutionsOf(m.sp);
  const cond = monConditions(m);
  const mega = megaOf(m.sp);
  const abil = [d.ab1 && { k: "1", n: d.ab1, l: "Ability 1" }, d.ab2 && { k: "2", n: d.ab2, l: "Ability 2" }].filter(Boolean);
  const vitTotal = Object.values(m.vit || {}).reduce((a, b) => a + b, 0);
  modal(monName(m), `
    <div class="row">${s.types.map(typeChip).join(" ")}<span class="muted small">${esc(m.sp)} · #${d.num || "?"}</span>${m.caught && m.caught.loc ? `<span class="muted small">· caught at ${esc(m.caught.loc)}</span>` : ""}</div>
    <div class="statline"><div class="st"><span>HP</span><b>${s.hp}</b></div><div class="st"><span>ATK</span><b>d${s.atk}</b></div><div class="st"><span>DEF</span><b>${s.def}</b></div><div class="st"><span>SPD</span><b>${s.spd}</b></div><div class="st"><span>BST</span><b>${s.hp + s.atk + s.def + s.spd}</b></div></div>
    <div class="grid2">

      <label class="f" for="m-gender">Gender<select id="m-gender"><option value="">None</option><option value="M" ${m.gender === "M" ? "selected" : ""}>♂ Male</option><option value="F" ${m.gender === "F" ? "selected" : ""}>♀ Female</option></select></label>
      <label class="f" for="m-nature">Nature<select id="m-nature">${NATURES.map((n) => `<option ${n.name === m.nature ? "selected" : ""}>${n.name}</option>`).join("")}</select></label>
      <label class="f" for="m-slot">Ability<select id="m-slot">${abil.map((a) => `<option value="${a.k}" ${String(m.slot) === a.k ? "selected" : ""}>${esc(a.n)}</option>`).join("")}</select></label>
      <label class="f" for="m-item">Held item<select id="m-item"><option value="">None</option>${[...new Set(Object.keys(S.bag).filter((k) => S.bag[k] > 0).concat(m.item ? [m.item] : []))].sort().map((k) => `<option ${k === m.item ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label>

      <label class="f" for="m-mark">Mark<select id="m-mark"><option value="">None</option>${MARKS.map((x) => `<option ${x.name === m.mark ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
    </div>
    <div class="row"><label class="check"><input type="checkbox" id="m-hid" ${m.hasHidden ? "checked" : ""} ${d.hidden ? "" : "disabled"}> Has Hidden Ability${d.hidden ? ": " + esc(d.hidden) : " (none)"}</label><label class="check"><input type="checkbox" id="m-shiny" ${m.shiny ? "checked" : ""}> Shiny</label></div>
    <div class="row between"><div><b>Friendship</b> <span class="num">${m.fr}${m.star ? "*" : ""}</span>/10</div><div class="row"><button class="btn sm" data-mf="-1">−1</button><button class="btn sm" data-mf="1">+1</button></div></div>
    ${monAbilities(m).map((a) => `<div class="reminder"><b>${esc(a)}</b>: ${esc(abText(a))}${abField(a) ? `<br><b>Field:</b> ${esc(abField(a))}` : ""}</div>`).join("")}
    <div class="small"><b>Weak:</b> ${mu[4].map((t) => typeChip(t) + "<sup>×4</sup>").join(" ")} ${mu[2].map(typeChip).join(" ") || "—"}<br><b>Resists:</b> ${mu[0.25].map((t) => typeChip(t) + "<sup>¼</sup>").join(" ")} ${mu[0.5].map(typeChip).join(" ") || "—"}${mu[0].length ? `<br><b>Immune:</b> ${mu[0].map(typeChip).join(" ")}` : ""}</div>
    <details><summary>Vitamins (${vitTotal}/3)</summary><div class="small muted" style="margin:6px 0">Max 3 vitamins, no more than 2 on the same stat. They stay through evolution.</div><div class="grid2">${["hp", "atk", "def", "spd"].map((k) => `<div class="row between"><span>${k.toUpperCase()} +${m.vit[k] || 0}</span><span class="row"><button class="btn sm" data-mv="${k}" data-v="-1">−</button><button class="btn sm" data-mv="${k}" data-v="1" ${vitTotal >= 3 || (m.vit[k] || 0) >= 2 ? "disabled" : ""}>+</button></span></div>`).join("")}</div></details>
    ${cond ? `<details><summary>Contest conditions · Sheen ${m.sheen || 0}/10</summary><div class="grid3" style="margin-top:6px">${CONDS.map(([k, n]) => `<div class="tile"><span class="lbl">${n}</span><span class="num">${cond[k]}</span><span class="row"><button class="btn sm" data-mc="${k}" data-v="-1">−</button><button class="btn sm" data-mc="${k}" data-v="1">+</button></span></div>`).join("")}</div><div class="tiny muted">Base values come from its ${esc(m.nature)} Nature. +/− records Pokéblock changes (each point adds 1 Sheen).</div></details>` : ""}
    ${evos.length ? `<div class="stack"><b>Evolution</b>${evos.map((e) => `<div class="row between"><span><b>${esc(e.name)}</b> <span class="small muted">${esc(e.evoMethod || "")}</span></span><button class="btn sm ${m.fr >= 10 || m.star ? "primary" : ""}" data-evo="${esc(e.name)}">Evolve</button></div>`).join("")}</div>` : ""}

    <div class="row"><button class="btn primary" data-msave>Save</button>${S.party.includes(m.id) ? `<button class="btn" data-mbox>Send to Box</button>` : `<button class="btn" data-mparty ${S.party.length >= 6 ? "disabled" : ""}>Add to Party</button>`}<button class="btn ghost danger" data-mrel>Release</button></div>`, (el) => {
    const grab = () => {
      m.nick = $("#m-nick", el).value.trim(); m.gender = $("#m-gender", el).value; m.nature = $("#m-nature", el).value; m.slot = +$("#m-slot", el).value || 1;
      m.hasHidden = $("#m-hid", el).checked; m.shiny = $("#m-shiny", el).checked; m.mark = $("#m-mark", el).value; m.status = $("#m-status", el).value; m.note = $("#m-note", el).value;
      const newItem = $("#m-item", el).value;
      if (newItem !== m.item) { if (m.item) S.bag[m.item] = (S.bag[m.item] || 0) + 1; if (newItem) { S.bag[newItem] = (S.bag[newItem] || 0) - 1; if (S.bag[newItem] <= 0) delete S.bag[newItem]; } m.item = newItem; }

    };
    el.addEventListener("change", (e) => { if (e.target.id === "m-slot" || e.target.id === "m-hid") { grab(); m.ab = monAbilities(m)[e.target.id === "m-hid" && m.hasHidden ? monAbilities(m).length - 1 : 0]; save(); openMon(id); } });
    el.addEventListener("click", (e) => {
      const t = e.target;

function evolve(m, to) {

function openCatch(B, enc) {
  const balls = Object.keys(S.bag).filter((k) => S.bag[k] > 0 && (itemFind(k) || {}).cat === "PokéBall");

  const me = B ? activeOf(B, "me")[0] : partyMons()[0] ? fighterFromMon(partyMons()[0]) : null;
  const st = statsAll(), lim = obedCap(st.obedience);
  const inBattle = !!B;

  modal(`Catch ${t.name}`, balls.length ? `
    <div class="grid2"><label class="f" for="c-ball">Ball<select id="c-ball">${balls.map((b) => `<option>${esc(b)} (${S.bag[b]})</option>`).join("")}</select></label>
      <label class="f" for="c-r">Your 2d20 total (blank = roll)<input id="c-r" type="number" min="2" max="40" placeholder="auto"></label>
      ${!inBattle && berries.length ? `<label class="f" for="c-berry">Offer a Berry<select id="c-berry"><option value="">None</option>${berries.map((b) => `<option>${esc(b)}</option>`).join("")}</select></label>` : ""}</div>
    <label class="check"><input type="checkbox" id="c-dark"> It's dark here (cave or night) — for Dusk Ball</label>
    <div class="small muted">${inBattle ? `Target: Base Stat Total ${t.bst} − damage dealt ${t.maxHp - t.hp}.` : `Target: Base Stat Total ${t.bst} − Compassion ${st.compassion}. Caught this way it starts at Friendship 3.`}${nat && nat.likes !== "N/A" ? ` Likes ${nat.likes}, dislikes ${nat.dislikes}.` : ""}</div>
    <button class="btn rose" data-throw>Throw</button><div id="c-out"></div>` : `<div class="empty">You have no Poké Balls in your Bag.</div>`, (el) => {
    const btn = $("[data-throw]", el); if (!btn) return;
    btn.addEventListener("click", () => {
      const ball = $("#c-ball", el).value.replace(/ \(\d+\)$/, "");
      if (t.bst > lim) { $("#c-out", el).innerHTML = `<div class="reminder"><b>Can't catch:</b> Base Stat Total ${t.bst} is over your limit of ${lim}.</div>`; return; }
      const round = B ? B.round : 1;
      const bm = ballMod(ball, { t, me, round, dark: $("#c-dark", el).checked });
      let comp = st.compassion, berryNote = "";
      const berry = $("#c-berry", el) && $("#c-berry", el).value;
      if (berry && nat) {
        const fl = BERRIES[berry]; const like = (nat.likes || "").toLowerCase(), dis = (nat.dislikes || "").toLowerCase();
        const main = (fl.flavor || "").split(",")[0].trim().toLowerCase(); const str = fl[main] || 1;
        if (main === dis) { comp -= str; berryNote = ` (${berry}: dislikes ${main}, −${str})`; } else { comp += str; berryNote = ` (${berry}: +${str})`; }
        S.bag[berry]--; if (!S.bag[berry]) delete S.bag[berry];
      }
      const dice = +$("#c-r", el).value ? [+$("#c-r", el).value] : roll(20, 2);
      const sum = dice.reduce((a, b) => a + b, 0);
      const total = sum + st.accuracy + (bm.master ? 0 : bm.v);
      const target = inBattle ? t.bst - (t.maxHp - t.hp) : t.bst - comp;
      S.bag[ball]--; if (!S.bag[ball]) delete S.bag[ball];
      const ok = bm.master || total > target;
      $("#c-out", el).innerHTML = `<div class="calc">2d20 = ${dice.join(" + ")}${dice.length > 1 ? " = " + sum : ""}\n+ Accuracy ${st.accuracy}\n${bm.notes.map((x) => "+ " + x).join("\n") || "+ " + ball + " +0"}\n= ${bm.master ? "Master Ball" : total} vs needs more than ${target}${berryNote}</div><div class="result ${ok ? "hit" : "miss"}">${ok ? "Gotcha! " + esc(t.name) + " was caught!" : "Oh no! It broke free."}</div>`;
      save(); render();
      if (ok) {
        const src = enc || (foe && foe.enc) || {};
        const m = newMon(t.sp, { gender: src.gender ?? t.gender, nature: src.nature, slot: src.slot, hasHidden: src.hasHidden, shiny: src.shiny, mark: src.mark, ball, fr: (inBattle ? 0 : 3) + ballFriendship(ball) });
        if (inBattle && !/Heal Ball/.test(ball)) m.hp = t.hp >= monStats(m).hp ? null : t.hp;

        setTimeout(() => { closeModal(); render(); toast(`${t.name} added to your ${S.party.includes(m.id) ? "party" : "Box"}`); }, 1100);
      } else if (B) { B.log.push(`${ball} missed — ${t.name} broke free (${total} vs ${target}).`); advanceTurn(B, activeOf(B, "me")[0]); save(); render(); }
    });

}

/* ============================================================
   Battle flow, setup, settings, story, cloud save, startup
   ============================================================ */
function findF(B, key) { for (const s of ["me", "foe"]) { const f = B.sides[s].mons.find((x) => x.key === key); if (f) return f; } return null; }
function currentFighter(B) { return turnOrder(B).find((f) => f.actedRound !== B.round) || null; }
function snap(B) { BUNDO.push(JSON.stringify(B)); if (BUNDO.length > 25) BUNDO.shift(); }
function replaceFainted(B) {
  for (const side of ["me", "foe"]) {
    const sd = B.sides[side];
    sd.active = sd.active.map((i) => {
      if (!sd.mons[i] || !sd.mons[i].fainted) return i;
      const next = sd.mons.findIndex((f, j) => !f.fainted && !sd.active.includes(j));
      if (next < 0) return i;
      const nf = sd.mons[next]; nf.actedRound = B.round;
      B.log.push(`${side === "me" ? "Go" : sd.trainer.name + " sends out"} ${nf.name}!`);
      onEnter(B, nf).forEach((m) => B.log.push(m));
      return next;
    });
  }
}
function applyHP(B, f, delta, why) {
  if (!f || f.fainted) return;
  f.hp = clamp(f.hp + delta, 0, f.maxHp);
  if (delta < 0) f.taken += -delta;
  if (why) B.log.push(`${f.name} ${delta < 0 ? "takes " + -delta : "restores " + delta} (${why}).`);
  if (f.hp === 0) { f.fainted = true; B.log.push(`${f.name} fainted.`); }
}
function advanceTurn(B, f) {
  if (f) { f.actedRound = B.round; f.acted = true; }
  replaceFainted(B);
  const left = turnOrder(B).filter((x) => x.actedRound !== B.round);

        if (trapped && foe.ability !== "Run Away") B.log.push(`${foe.name} tries to flee but can't escape.`);

}
function doAttack() {

/* ---------- story ---------- */
function storyFallback() {
  const n = S.trainer.name || "Our trainer";
  const stages = {};
  S.log.forEach((e) => (stages[e.lvl] = stages[e.lvl] || []).push(e));
  const parts = [`${n}'s journey across the Austra Region`];
  Object.keys(stages).sort((a, b) => a - b).forEach((lv) => {
    const es = stages[lv];
    const places = [...new Set(es.filter((e) => e.type === "visit").map((e) => e.loc))];
    const caught = es.filter((e) => e.type === "catch").map((e) => e.text.replace(/^(Caught|Received|Chose) (a |an |a shiny )?/, "").replace(/ in a .*| as a partner.*|\.$/g, ""));
    const wins = es.filter((e) => e.type === "win").length;
    const big = es.filter((e) => /badge|ribbon|symbol|evolve|title/.test(e.type)).map((e) => e.text);
    const evs = es.filter((e) => e.type === "event").map((e) => e.text.replace(/^Completed /, "").replace(/\.$/, ""));
    let p = `\n\n${+lv === 0 ? "Chapter 1 — Setting out" : `Chapter ${+lv + 1} — With ${lv} Badge${+lv === 1 ? "" : "s"} of experience`}\n`;
    if (places.length) p += `${n} traveled through ${places.join(", ")}. `;
    if (caught.length) p += `New friends joined the team: ${caught.join(", ")}. `;
    if (evs.length) p += `Along the way ${n} took on ${evs.join(", ")}. `;
    if (wins) p += `${wins} battle${wins === 1 ? " was" : "s were"} won. `;
    if (big.length) p += big.join(" ");
    parts.push(p.trim() ? p : "");
  });
  return parts.join("").trim();
}
async function writeStory() {
  const el = $("#story");
  const sample = window.claude && claude.use ? await claude.use("sample").catch(() => null) : null;
  if (!sample) { S.story = storyFallback(); commit("Story written from your journal"); return; }
  if (el) el.textContent = "Writing…";
  const facts = S.log.map((e) => `[level ${e.lvl}] ${LOG_LABEL[e.type] || e.type} @ ${e.loc}: ${e.text}`).join("\n");
  const party = partyMons().map((m) => `${monName(m)} (${m.sp}, Friendship ${m.fr})`).join(", ");
  const prompt = `You are writing a short adventure recap for a tabletop Pokémon game called Pokémon Opal, set in the Austra Region. Write it like a lively recap of an anime journey, in plain warm language, for the player to read and share. Use ONLY the facts in the journal below; do not invent battles, places or Pokémon. Organize it into short chapters, one per "level" group, each with a short title line. Keep it under 450 words. Plain text only, no markdown symbols.\n\nTrainer: ${S.trainer.name} from ${S.trainer.hometown || "unknown"}, aiming to become ${S.trainer.goal}.\nCurrent party: ${party}\nBadges ${badgeCount()}, Ribbons ${ribbonCount()}, Symbols ${symbolCount()}.\n\nJournal (oldest first):\n${facts}`;
  try {
    const r = await sample(prompt, { modelTier: "default", onText: ({ text }) => { const s = $("#story"); if (s) s.textContent = text; } });
    S.story = (r.text || "").trim() || storyFallback();
    commit("Story updated");
  } catch (e) {
    S.story = storyFallback();
    commit(e && e.code === "rate_limited" ? "Busy right now, so here's a quick version from your journal" : "Story written from your journal");
  }
}

  modal("Save & settings", `
    <div class="reminder">${CLOUD.ok ? "<b>Synced to your Claude account.</b> Open this page on any device you're signed in on to keep playing." : (window.OPAL_STANDALONE ? "<b>Saved on this device.</b> Download a save file to back up or move your journey to another device." : "<b>Saved in this browser only.</b> Use the save code to move to another device.")}</div>
    <label class="f" for="st-lv">Event level override<select id="st-lv"><option value="">Automatic (${levelSource()})</option>${Array.from({ length: 11 }, (_, i) => `<option value="${i}" ${String(S.settings.levelOverride) === String(i) ? "selected" : ""}>${i}</option>`).join("")}</select></label>
    <div class="tiny muted">Use this when you play with someone who has more Badges (events follow the trainer with the most), or when you're not collecting Badges or Ribbons and choose when to move up (5 events per level).</div>
    <label class="f" for="st-code">Save code<textarea id="st-code" readonly>${code}</textarea></label>
    <div class="row"><button class="btn" data-st-copy>Copy save code</button>${window.OPAL_STANDALONE ? `<button class="btn" data-st-dl>Download save file</button><label class="btn" for="st-file">Load save file</label><input type="file" id="st-file" accept=".json,application/json" hidden>` : ""}</div>
    <label class="f" for="st-imp">Load a save code<textarea id="st-imp" placeholder="Paste a save code here"></textarea></label>
    <div class="row"><button class="btn" data-st-imp>Load save</button><button class="btn ghost danger" data-st-new>Start a new journey</button></div>`, (el) => {
    $("#st-lv", el).addEventListener("change", (e) => { S.settings.levelOverride = e.target.value === "" ? null : +e.target.value; commit("Event level updated"); });
    $("[data-st-copy]", el).addEventListener("click", async () => { try { await navigator.clipboard.writeText(code); toast("Save code copied"); } catch (e) { $("#st-code", el).select(); toast("Select the code and copy it"); } });
    const loadObj = (o) => { if (!o || !o.trainer) throw 0; o.cloudId = S.cloudId; S = Object.assign(blankState(), o); S.demo = false; closeModal(); commit("Save loaded"); };
    const dl = $("[data-st-dl]", el);
    if (dl) dl.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify({ ...S, battle: null }, null, 1)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `opal-${(S.trainer.name || "trainer").replace(/[^\w-]+/g, "-")}-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast("Save file downloaded");
    });
    const fi = $("#st-file", el);
    if (fi) fi.addEventListener("change", async () => { try { loadObj(JSON.parse(await fi.files[0].text())); } catch (e) { toast("That file isn't an Opal save."); } });
    $("[data-st-imp]", el).addEventListener("click", () => {
      try { const o = JSON.parse(decodeURIComponent(escape(atob($("#st-imp", el).value.trim())))); if (!o || !o.trainer) throw 0; o.cloudId = S.cloudId; S = Object.assign(blankState(), o); S.demo = false; closeModal(); commit("Save loaded"); }
      catch (e) { toast("That code didn't work. Copy the whole thing and try again."); }
    });
    $("[data-st-new]", el).addEventListener("click", () => openNewGame(false));
  });
}
function openProfile() {
  modal("Trainer profile", `<div class="grid2"><label class="f" for="pf-n">Name<input id="pf-n" type="text" value="${esc(S.trainer.name)}"></label><label class="f" for="pf-a">Age<input id="pf-a" type="text" value="${esc(S.trainer.age)}"></label>
    <label class="f" for="pf-h">Hometown<input id="pf-h" type="text" value="${esc(S.trainer.hometown)}"></label><label class="f" for="pf-g">Title to aim for<input id="pf-g" type="text" value="${esc(S.trainer.goal)}"></label></div>
    <label class="f" for="pf-m">Money (₽)<input id="pf-m" type="number" min="0" value="${S.money}"></label>
    <button class="btn primary" data-pf>Save</button>`, (el) => $("[data-pf]", el).addEventListener("click", () => {
    S.trainer.name = $("#pf-n", el).value.trim(); S.trainer.age = $("#pf-a", el).value.trim(); S.trainer.hometown = $("#pf-h", el).value.trim(); S.trainer.goal = $("#pf-g", el).value.trim();
    S.money = Math.max(0, +$("#pf-m", el).value || 0); closeModal(); commit("Saved");
  }));
}
function openMoney(sign) {
  modal(sign > 0 ? "Add money" : "Spend money", `<label class="f" for="mo-v">Amount (₽)<input id="mo-v" type="number" min="0" inputmode="numeric"></label><label class="f" for="mo-w">What for (optional)<input id="mo-w" type="text"></label><button class="btn primary" data-mo>${sign > 0 ? "Add" : "Spend"}</button>`, (el) => $("[data-mo]", el).addEventListener("click", () => {
    const v = Math.max(0, +$("#mo-v", el).value || 0); if (!v) return;
    if (sign < 0 && v > S.money) { toast(`You only have ${money(S.money)}.`); return; }
    S.money += sign * v; const w = $("#mo-w", el).value.trim(); if (w) log("item", `${sign > 0 ? "Got" : "Spent"} ${money(v)}: ${w}.`);
    closeModal(); commit();
  }));
}

/* ---------- cloud save (Claude account) ---------- */
const CLOUD = { ok: false, ref: null, writing: false, again: false };
async function cloudInit() {
  if (!window.claude || !claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    CLOUD.ref = db.doc("data/users/" + id + "/opal");
    const snapDoc = await CLOUD.ref.get();
    const body = snapDoc.exists ? snapDoc.data() : null;
    CLOUD.ok = true;
    if (body && body.json) {
      const remote = JSON.parse(body.json);
      if (!S || S.demo || (remote.updated || 0) > (S.updated || 0)) { S = Object.assign(blankState(), remote); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} render(); toast("Loaded your saved journey"); }
    } else if (S && !S.demo) cloudSave();
    syncPill();
  } catch (e) { CLOUD.ok = false; syncPill(); }
}
async function cloudSave() {
  if (!CLOUD.ref || !S || S.demo) return;
  if (CLOUD.writing) { CLOUD.again = true; return; }
  CLOUD.writing = true;
  try {
    let copy = { ...S, battle: S.battle };
    let json = JSON.stringify(copy);
    if (json.length > 240000) { copy = { ...copy, battle: null, log: copy.log.slice(-600) }; json = JSON.stringify(copy); }
    await CLOUD.ref.set({ json, updated: S.updated, name: S.trainer.name || "" });
    CLOUD.ok = true;
  } catch (e) { CLOUD.ok = false; }
  CLOUD.writing = false; syncPill();
  if (CLOUD.again) { CLOUD.again = false; cloudSave(); }
}
function syncPill() { const p = $("#sync-pill"); if (!p) return; p.textContent = S && S.demo ? "Example data" : CLOUD.ok ? "Synced" : "Saved on this device"; p.classList.toggle("on", !!CLOUD.ok && !(S && S.demo)); }

/* ============================================================
   Event delegation
   ============================================================ */
document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, B = S.battle;
  if (a === "modal-scrim" && e.target !== el) return;
  switch (a) {
    case "modal-close": case "modal-scrim": closeModal(); break;
    case "open-settings": openSettings(); break;
    case "new-game": openNewGame(S.demo); break;
    case "edit-profile": openProfile(); break;
    case "money": openMoney(+el.dataset.v); break;
    case "award": openAward(el.dataset.id); break;
    case "contest-win": openAward(el.dataset.id, null, el.dataset.type); break;
    case "title": S.titles = S.titles || {}; S.titles[el.dataset.t] = el.checked; if (el.checked) log("title", `Earned the title ${el.dataset.t}!`); save(); break;
    case "mon-tab": UI.monTab = el.dataset.v; render(); break;
    case "mon-add": openAddMon(); break;
    case "mon-open": openMon(el.dataset.id); break;
    case "mon-box": S.party = S.party.filter((x) => x !== el.dataset.id); commit(); break;
    case "mon-party": if (S.party.length < 6) S.party.push(el.dataset.id); commit(); break;
    case "heal-all": partyMons().forEach((m) => { m.hp = null; m.status = ""; }); log("note", `Healed the party at the ${S.loc} Pokémon Center.`); commit("Your Pokémon are fully healed"); break;
    case "item-add": openItemAdd(); break;
    case "item-info": openItemInfo(el.dataset.name); break;
    case "item-use": useItem(el.dataset.name); break;
    case "qty": addItem(el.dataset.name, +el.dataset.v); commit(); break;
    case "travel": travel(el.dataset.to); break;
    case "ev-done": S.events[el.dataset.k] = "done"; log("event", `Completed ${el.dataset.t}.`); commit("Event completed"); break;
    case "ev-fail": S.events[el.dataset.k] = "failed"; log("fail", `Didn't manage ${el.dataset.t}.`); commit(); break;
    case "ev-undo": delete S.events[el.dataset.k]; commit(); break;
    case "collect": { const n = el.dataset.name; S.collected[S.loc + "|" + n] = true; const fix = ITEM_FIX[n.toLowerCase()]; if (/^5 Pok|×5/.test(n)) addItem("Poké Ball", 5, `Picked up 5 Poké Balls.`); else addItem(fix || n, 1, `Picked up ${n} at ${S.loc}.`); commit(`${n} added to your Bag`); break; }
    case "encounter": openEncounter(); break;
    case "wild-pick": { const L = LOCMAP.get(S.loc); modal("Pick a wild Pokémon", `<div class="pick">${L.wd.map((w, i) => `<button data-wi="${i}"><span><b>${esc(w[1])}</b> <span class="tiny muted">Rate ${w[0]}</span></span><span>${w[2].map(typeChip).join(" ")}</span></button>`).join("")}</div>`, (m) => m.addEventListener("click", (ev) => { const b = ev.target.closest("[data-wi]"); if (b) openWild(+b.dataset.wi); })); break; }
    case "battle-trainer": startTrainerBattle(el.dataset.loc, +el.dataset.i); break;
    case "pvp": openPvp(); break;
    case "attack": doAttack(); break;
    case "skip": snap(B); { const c = currentFighter(B); B.log.push(`${c.name} skips its turn.`); advanceTurn(B, c); } save(); render(); break;
    case "hp": { const f = findF(B, el.dataset.k); snap(B); if (f.fainted && +el.dataset.v > 0) f.fainted = false; applyHP(B, f, +el.dataset.v); save(); render(); break; }
    case "swap": { const sd = B.sides[el.dataset.side]; const i = +el.dataset.i; snap(B); const slot = sd.active.findIndex((x) => sd.mons[x].fainted); const at = slot >= 0 ? slot : 0; const out = sd.mons[sd.active[at]]; sd.active[at] = i; const nf = sd.mons[i]; B.log.push(`${out.name} is switched out for ${nf.name}.`); if (fx(out).natural || out.ability === "Natural Cure") out.status = ""; if (out.ability === "Regenerator") out.hp = Math.min(out.maxHp, out.hp + 2); for (const k of Object.keys(out.vol)) delete out.vol[k]; if (out.origAbility) { out.ability = out.origAbility; out.origAbility = ""; } if (out.mega && B.gimmick[out.side] === "Mega") { /* stays mega per rules: reverts when switched */ } onEnter(B, nf).forEach((m) => B.log.push(m)); save(); render(); break; }
    case "status": openStatus(el.dataset.k); break;
    case "mods": openMods(el.dataset.k); break;
    case "b-item": battleItem(); break;
    case "b-catch": openCatch(B); break;
    case "mega": {
      const c = currentFighter(B), mg = megaOf(c.sp);
      const stone = itemFind(c.item);
      if (!stone || stone.cat !== "Mega Stone" || !new RegExp(dkey(c.sp).split(" ").pop(), "i").test(stone.desc)) { toast(`${c.name} needs to hold its Mega Stone.`); break; }
      snap(B); const diff = mg.hp - c.base.hp;
      c.mega = true; c.base = { hp: mg.hp, atk: mg.atk, def: mg.def, spd: mg.spd }; c.types = mg.types.slice(); c.maxHp += diff; c.hp += diff; c.bst = mg.total;
      if (mg.ab1 && ABIL[mg.ab1]) c.ability = mg.ab1;
      B.gimmick[c.side] = "Mega"; B.log.push(`${c.name} Mega Evolved into ${mg.name}!`); save(); render(); break;
    }
    case "dmax": { const c = currentFighter(B); snap(B); c.dmax = 3; c.maxHp *= 2; c.hp *= 2; B.gimmick[c.side] = "Dynamax"; B.log.push(`${c.name} Dynamaxed! HP doubled for 3 turns and it moves first.`); save(); render(); break; }
    case "b-run": if (B.kind === "wild") { B.over = "ran"; B.log.push("Got away safely."); } else B.over = "end"; save(); render(); break;
    case "b-forfeit": B.over = "loss"; B.log.push("You forfeited."); save(); render(); break;
    case "b-undo": if (BUNDO.length) { S.battle = JSON.parse(BUNDO.pop()); UI.lastAttack = null; save(); render(); } break;
    case "b-abandon": if (el.dataset.confirm) { S.battle = null; UI.lastAttack = null; commit("Battle closed without saving"); } else { el.dataset.confirm = "1"; el.textContent = "Tap again to close without saving"; } break;
    case "b-finish": battleFinish(el.dataset.res); break;
    case "story": writeStory(); break;
    case "copy-story": navigator.clipboard.writeText(S.story).then(() => toast("Story copied"), () => toast("Select the text to copy it")); break;
    case "note-add": modal("Add a note", `<textarea id="nt"></textarea><button class="btn primary" data-nt>Add to journal</button>`, (m) => $("[data-nt]", m).addEventListener("click", () => { const v = $("#nt", m).value.trim(); if (v) log("note", v); closeModal(); commit(); })); break;
    case "jfilter": UI.journalFilter = el.dataset.v; render(); break;
  }
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-change]"); if (!el) return;
  const c = el.dataset.change, B = S.battle;
  if (c === "loc") travel(el.value, "Went to");
  else if (c === "bw") { B.weather = el.value; B.weatherTurns = 0; save(); render(); }
  else if (c === "bt") { B.terrain = el.value; B.terrainTurns = 0; save(); render(); }
  else if (c === "fab") { const f = findF(B, el.dataset.k); f.ability = el.value; f.entered = false; onEnter(B, f).forEach((m) => B.log.push(m)); save(); render(); }
  else if (c.startsWith("qc-")) {
    const k = c.slice(3), v = el.type === "checkbox" ? el.checked : el.value;
    if ((k === "a" || k === "d") && v === "__dex") { dexPicker("Pick a Pokémon", (sp) => { UI.calc[k] = "d:" + sp; closeModal(); render(); }); return; }
    const map = { a: "a", d: "d", w: "w", t: "t", has: "dHas", o: "dObd", i: "dInt", wl: "dWill" };
    UI.calc[map[k]] = v; render();
  }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.input === "bag-q") { UI.bagQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#bag-q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.addEventListener("toggle", (e) => { const d = e.target; if (d.dataset && d.dataset.det) UI.mapShow[d.dataset.det] = d.open; }, true);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && MODAL) closeModal(); });

/* ---------- start ---------- */
(function boot() {
  const saved = lastSaved();
  S = saved && saved.trainer ? Object.assign(blankState(), saved) : demoState();
  if (!S.visited[S.loc]) S.visited[S.loc] = 1;
  render(); syncPill();
  cloudInit();
})();

</script>
