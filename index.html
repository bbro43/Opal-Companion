e Battle Chalet Frontier Brain Rory also known as the Pokéball Maker. Rory is hoping that one day he can discover the hidden hot springs to one day bring Peak Town more notoriety beyond just himself.","it":["Apricorn Box","Blue Apricorn","Green Apricorn","Pink Apricorn","Red Apricorn","White Apricorn","Yellow Apricorn"],"ev":[{"t":"The Battle Chalet","r":"+8 Badges","q":{"badges":{"min":8}},"d":"Lead by the welcoming Frontier Brain Rory, this facility rewards its participants with the Guts Symbol. Rory is an active mountain climber who built a Chalet in the mountains as he began his quest for the rumored hot springs that generate the fog on Cradle Mountain. Rory doesn’t have a set battle style, but lets his opponent choose if they would rather have a single or double battle. However he does wear two Mega Bracelet and is uniquely capable of Mega Evolving twice per battle, while all other trainers can only Mega Evolve once."},{"t":"The Pokéball Maker","r":"₽200","q":{"cost":200},"d":"A small store located next to the Battle Chalet, where Rory spends his time when he’s not climbing the mountain or battling Frontier Challengers. Rory keeps several trees outside the store to grow apricorns. Rory loves converting apricorns into Pokéballs and gladly will do it if you provide the necessary apricorn and pay for the electrical components for the ball."},{"t":"The Hidden Hot Springs","r":"Complete The Fiery Rampage, ₽1000","q":{"cost":1000,"cond":"Complete The Fiery Rampage"},"d":"After a rampaging Pokémon tore apart the mountain, Rory decided it was the perfect time to go and resume his search for the Hot Spring. Rory finally after years of searching discovers the Hot Springs & builds a cable car lift from his Chalet down to the location of the small spring resort he is building. With the new Hot Springs Resort open, any visitors can rent a private pool for a relaxing day with their Pokémon."},{"t":"The Catching Charm","r":"+8 Badges","q":{"badges":{"min":8}},"d":"After traveling a long way on your Journey, Rory notes that he is impressed with the connection that you have with your Pokémon. So much so that he offers you the Catching Charm. He explains that it’s a rare item that increase a Trainers odds of catching a wild Pokémon."},{"t":"Rival Battle Jayden","r":"7-8 Badges","q":{"badges":{"min":7,"max":8}},"d":"While traveling you encounter Jayden who has informed you not only does he have 8 Badges but he just won an unofficial exhibition match against Frontier Brain Rory. He then challenges you to a 3 on 3 battle."}],"wd":[],"tr":[{"n":"Frontier Brain Rory","at":"Battle Chalet","e":"","rw":"₽3,500","o":3,"i":3,"wl":3,"nt":"Mega Stones: Steelixite & Gogoatite","m":[["Steelix",["STEEL","GROUND"],8,8,13,3,"Rock Head",""],["Weavile",["DARK","ICE"],7,8,8,13,"Pressure",""],["Magcargo",["FIRE","ROCK"],6,8,10,3,"Flame Body",""],["Mamoswine",["ICE","GROUND"],11,10,7,8,"Oblivious","Guts"],["Bouffalant",["NORMAL"],10,8,10,6,"Reckless","Keen Eye"],["Gogoat",["GRASS"],13,10,7,7,"Sap Sipper",""],["Mega Steelix",["STEEL","GROUND"],8,10,16,3,"Sand Force",""],["Mega Gogoat",["GRASS","ROCK"],13,12,9,10,"Sap Sipper",""]]},{"n":"Rival Jayden","at":"Outside of the Battle Chalet (Rival Battle Jayden)","e":"Rival Battle Jayden","rw":"","o":4,"i":3,"wl":3,"nt":"","m":[["Austran Arcanine",["ELECTRIC"],9,10,8,10,"Transistor","Justified"],["Talonflame",["FIRE","FLYING"],8,8,7,13,"Flame Body","Gale Wings"],["Copperajah",["STEEL"],13,10,7,3,"Sheer Force","Heavy Metal"]]},{"n":"Trainer Mia","at":"Pokémon Center (Ace Trainer Battle +7 Badges)","e":"Ace Trainer Battle +7 Badges","rw":"","o":4,"i":3,"wl":3,"nt":"","m":[["Nidoqueen",["POISON","GROUND"],9,8,9,8,"Poison Point",""],["Blissey",["NORMAL"],26,4,7,6,"Natural Cure",""],["Gholdengo",["STEEL","GHOST"],9,10,9,9,"Good as Gold",""]]},{"n":"Trainer Ella","at":"Pokemon Center (Ace Trainer Battle 4-6 Badges)","e":"Ace Trainer Battle 4-6 Badges","rw":"","o":3,"i":1,"wl":2,"nt":"","m":[["Kingler",["WATER"],6,10,8,8,"Hyper Cutter",""],["Austran Ariados",["DARK","POISON"],7,8,7,4,"Dark Aura",""],["Pangoro",["FIGHTING","DARK"],10,10,7,6,"Iron Fist",""]]}]},{"n":"Ballarat City","k":"town","c":"Central","w":"Normal","t":"Normal","cn":["Mafia Base","Route C01"],"poi":[["Pokémon Center",""],["Pokémart",""],["Ballarat Contest Hall",""],["Mint Nursery",""],["Acro Bike Shop",""],["Ballarat Department Store",""],["Contest Boutique",""]],"lore":"A city in Central County that has basically been overran by the Mafia. At the city limits is a compound of buildings that is the true base of operations for the Mafia. One of the only cities where the police have been bought out by the Mafia, Ballarat has a strict no battle policy, unless it is in the Contest Hall, which is frequently visited by the top brass of the Mafia, to the point they have their own box suite in the hall. Many people still visit though for the famous Department Store.","it":["Amulet Coin"],"ev":[{"t":"Ballarat Contest Hall","r":"","q":{},"d":"One of 7 Contest Halls in the Austra Region. Ballarat Hall hosts the following contests:"},{"t":"Beauty Contest","r":"6 Ribbons","q":{"ribbons":{"set":[6]}},"d":"Primary: Beauty, Secondary: Cool & Cute"},{"t":"Cool Contest","r":"0 or 5 Ribbons","q":{"ribbons":{"set":[0,5]}},"d":"Primary: Cool, Secondary: Beauty & Tough"},{"t":"Cute Contest","r":"1 or 4 Ribbons","q":{"ribbons":{"set":[1,4]}},"d":"Primary: Cute, Secondary: Beauty & Clever"},{"t":"Clever Contest","r":"3 Ribbons","q":{"ribbons":{"set":[3]}},"d":"Primary: Clever, Secondary: Cute & Tough"},{"t":"Tough Contest","r":"2 Ribbons","q":{"ribbons":{"set":[2]}},"d":"Primary: Tough, Secondary: Clever & Cool Roll 3d10 to determine the other three participants in the contest."},{"t":"The Mint Nursery","r":"","q":{},"d":"A small little nursery located on the south side of the city. It is the only place where you can by Mints throughout the region."},{"t":"The Acro Bike Shop","r":"","q":{},"d":"A bike shop located in town that sells Acro Bikes to those wanting to use Cycle Road. Acro Bikes cost ₽20,000."}],"wd":[],"tr":[]},{"n":"Long City","k":"town","c":"Central","w":"Sunshine","t":"Normal","cn":["Route C03","Route C05"],"poi":[["Pokémon Center",""],["Pokémart",""],["Battle Ranch",""],["The Dynamax Shop",""],["Mach Bike Shop",""]],"lore":"Found at the edge of Central County, Long City has become famous for the racers who zip down Cycle Road at record speeds and the gigantic Pokémon Battles at the Battle Ranch. However while it is famous for those two items, there really isn’t much else to do in this city.","it":["Moomoo Milk","Heal Powder","Sweet Apple","Tart Apple"],"ev":[{"t":"The Dynamax Tutorial","r":"","q":{},"d":"Located in one of the cities many shopping centers is the is a store with a unique crisp white design. Inside is a young woman named Alice from the Galar region selling white bracelets with a solid black strip in the middle and a small blue icon I the center. She tells you that these bands contain the power of a Wishing Star that can unlock a gigantic power in Pokémon. She offers to build you a Dynamax Band for ₽20,000 if you can collect a Wishing Star and bring it to her. If you do so she will give you the power to Dynamax and offers you a practice battle over at the Battle Ranch to demonstrate how the power works. Dynamax: A special power that temporarily enlarges any Pokémon for 3 turns. Dynamax Pokémon doubles the Pokémon’s HP. It also allows the Pokémon to move first, unless the other Pokémon has an Item or Ability that grants priority movement. Only one Dynamax can be used per battle and the ability will revert if the Pokémon is either defeated or substituted out of battle."},{"t":"The Mach Bike Shop","r":"","q":{},"d":"A bike shop located in town that sells Mach Bikes to those wanting to use Cycle Road. Mach Bikes cost ₽20,000."},{"t":"The Battle Ranch","r":"+8 Badges","q":{"badges":{"min":8}},"d":"Located right outside of Long City is the Battle Ranch ran by Frontier Brain Sterling. This facility rewards its participants with the Spirits Symbol. Sterling built the Ranch to raise and take care of Pokémon. The large area offers a unique opportunity for a Battle where his Pokémon can Dynamax freely. Sterling has a unique Dynamax Band that can store enough energy to Dynamaxing a single Pokémon for 6 or Dynamaxing two Pokémon for 3 turns each., while all other trainers can only Dynamax one Pokémon for 3 turns per battle."},{"t":"Rival Battle Chloe","r":"3-5 Badges","q":{"badges":{"min":3,"max":5}},"d":"While traveling you encounter Chloe who is at the Battle Ranch who got permission to take some photos of the unique Dynamaxing Pokémon. Frontier Brain Sterling then offers to let you two use the Battle Ranch field for a 3 on 3 battle."}],"wd":[],"tr":[{"n":"Alice","at":"Battle Ranch (The Dynamax Tutorial)","e":"The Dynamax Tutorial","rw":"₽1000","o":0,"i":0,"wl":3,"nt":"Dynamax: Pancham","m":[["Pancham",["FIGHTING"],7,6,6,5,"Iron Fist",""]]},{"n":"Frontier Brain Sterling","at":"Battle Ranch","e":"","rw":"₽3,500","o":3,"i":3,"wl":3,"nt":"Dynamax: Grumpig and Lycanroc","m":[["Rapidash",["FIRE"],7,10,8,11,"Run Away",""],["Ampharos",["ELECTRIC"],9,10,9,6,"Static",""],["Sunflora",["GRASS"],8,10,7,3,"Chlorophyll",""],["Miltank",["NORMAL"],10,6,9,10,"Scrappy","Sap Sipper"],["Grumpig",["PSYCHIC"],8,6,9,8,"Own Tempo","Gluttony"],["Lycanroc Midnight Form",["ROCK"],9,8,8,9,"Vital Spirit","No Guard"]]},{"n":"Rival Chloe","at":"At Battle Ranch (Rival Battle Chloe)","e":"Rival Battle Chloe","rw":"","o":4,"i":3,"wl":3,"nt":"","m":[["Austran Spinarak",["DARK","POISON"],4,6,4,3,"Dark Aura","Sniper"],["Phantump",["GHOST","GRASS"],5,6,5,4,"Natural Cure","Harvest"],["Alolan Rattata",["DARK","NORMAL"],3,4,4,8,"Gluttony","Thick Fat"]]},{"n":"Trainer Elija","at":"Pokémon Center (Ace Trainer Battle 1-3 Badges)","e":"Ace Trainer Battle 1-3 Badges","rw":"","o":4,"i":3,"wl":3,"nt":"","m":[["Machop",["FIGHTING"],7,6,4,4,"No Guard",""],["Paldean Wooper",["POISON","GROUND"],6,4,4,2,"Poison Point",""]]},{"n":"Trainer Lucas","at":"Pokémon Center (Ace Trainer Battle 4 – 6 Badges)","e":"Ace Trainer Battle 4 – 6 Badges","rw":"","o":2,"i":4,"wl":3,"nt":"","m":[["Goldeen",["WATER"],5,6,6,7,"Swift Swim",""],["Thievul",["DARK"],7,8,8,9,"Run Away",""],["Lycanroc Midday Form",["ROCK"],8,8,7,12,"Keen Eye",""]]}]},{"n":"Berra Town","k":"town","c":"Central","w":"Normal","t":"Normal","cn":["Route C10"],"poi":[["Pokémon Center",""],["Pokémart",""],["Berra Contest Hall",""],["Battle Forest",""],["Antique Store",""]],"lore":"The only town in any county that is completely isolated from the rest of the rest of the towns/cities in their respective county, Berra town is surrounded by the Battle Forest and cut off from the rest of the county by Cradle Mountain. While there aren’t to many reasons to visit Berra Town, it’s a unique town that will sure lead to some fateful encounters.","it":["Eviolite","Life Orb","Focus Sash","Berserk Gene"],"ev":[{"t":"Berra Contest Hall","r":"","q":{},"d":"One of 7 Contest Halls in the Austra Region. Berra Hall hosts the following contests:"},{"t":"Beauty Contest","r":"0 or 5 Ribbons","q":{"ribbons":{"set":[0,5]}},"d":"Primary: Beauty, Secondary: Cool & Cute"},{"t":"Cool Contest","r":"4 Ribbons","q":{"ribbons":{"set":[4]}},"d":"Primary: Cool, Secondary: Beauty & Tough"},{"t":"Cute Contest","r":"3 Ribbons","q":{"ribbons":{"set":[3]}},"d":"Primary: Cute, Secondary: Beauty & Clever"},{"t":"Clever Contest","r":"2 Ribbons","q":{"ribbons":{"set":[2]}},"d":"Primary: Clever, Secondary: Cute & Tough"},{"t":"Tough Contest","r":"1 or 6 Ribbons","q":{"ribbons":{"set":[1,6]}},"d":"Primary: Tough, Secondary: Clever & Cool Roll 3d10 to determine the other three participants in the contest."},{"t":"The Battle Forest","r":"+8 Badges","q":{"badges":{"min":8}},"d":"A huge forest that surrounds Berra Town also serves as the Battle Frontier Facility for by Frontier Brain George. This facility rewards its participants with the Luck Symbol. This Facility is unique being that it is the only facility that operates without a building. Trainers challenging the Battle Forest will compete in a series of one-on-one matches, with no substitutions, healing items or repeat Pokémon. Each win will reward 1 point, & first to 4 points wins. If neither combatant has 4 points at the end of the battle, the active Pokémon with the most HP remaining for each will battle for the final point."},{"t":"The Cryptic Shopkeeper","r":"+8 Badges, Rangers see The Cryptic Warning Mission","q":{"badges":{"min":8},"cond":"Rangers see The Cryptic Warning Mission"},"d":"In a small Antique Store, sits an elderly blind woman. As you enter the store, she immediately identifies you as a trainer with a strong aura. She proclaims that it was fate that you visited and offers you one of her sacred treasures from the back. The old lady offers you the choice of one of the following items: Prison Bottle, Cracked Jewel, Mysterious Box, The Sea Crown, Wish Crystal, Ancient Sword, Yellow Bow, Victory Feather, Yo-Yo, Mysterious Egg, Soul-Heart, or Red Shoes."}],"wd":[],"tr":[{"n":"Frontier Brain George","at":"Battle Forest","e":"","rw":"₽3,500","o":1,"i":3,"wl":3,"nt":"George only has one Darmanitan, starts in Standard Mode Vigoroth is holding an Eviolite, raising its Def from 7 to 14. Presley - Bris Contest Hall (Ace Trainer Battle +7 Badges)","m":[["Austran Ambipom",["NORMAL","PSYCHIC"],8,8,7,12,"Technician",""],["Simisage",["GRASS"],8,10,6,11,"Gluttony",""],["Simisear",["FIRE"],8,10,6,11,"Gluttony",""],["Simipour",["WATER"],8,10,6,11,"Gluttony",""],["Darmanitan Standard Mode",["FIRE"],11,8,6,10,"Sheer Force",""],["Vigoroth",["NORMAL"],8,6,14,9,"Vital Spirit",""],["Darmanitan Zen Mode",["FIRE","PSYCHIC"],11,8,11,6,"Zen Mode",""],["Forretress",["BUG","STEEL"],8,8,10,4,"Sturdy",""],["Sliggoo",["DRAGON"],7,8,8,6,"Sap Sipper","Hydration"]]},{"n":"Trainer Lucas","at":"Pokémon Center (Ace Trainer Battle +7 Badges)","e":"Ace Trainer Battle +7 Badges","rw":"","o": imination tournament, following the same 3 vs 3 rules as a Gym Battle. The final match of the Conference to decide the who gets the title and rank of “Champion” expands the team limit from 3 to 6. If one wins the Conference, they are allowed to compete in the Austra Champions League. See Page P45 for the Conference Contestants and Page R12 for additional rules."},{"t":"Austra Champions League","r":"Endigio League Conference Champion","q":{"cond":"Endigio League Conference Champion"},"d":"After earning the title of Champion, you are allowed to compete in the Champions League. The Champions League is a Round Robin Tournament where other former champions, including the Elite 4 face off for opportunity to challenge the Austra Grand Champion. Defeating Grand Champion Erwin to earn the title and rank of “Grand Champion”. See Page P53 for the Champions League and Page R13 for additional rules."},{"t":"Gym Leader Rematches","r":"After Endigio LeagueConference","q":{"cond":"After Endigio LeagueConference"},"d":"After competing in the Endingo Conference, you will be able to rematch the Gym Leaders in 6v6 full battles using their full power."}],"wd":[],"tr":[{"n":"Trainer Oliver","at":"Endigio League Conference","e":"","rw":"","o":3,"i":3,"wl":2,"nt":"","m":[["Arbok",["POISON"],6,8,7,8,"Intimidate",""],["Scyther",["BUG","FLYING"],7,8,8,11,"Swarm",""],["Weavile",["DARK","ICE"],7,8,8,13,"Pressure",""],["Breloom",["GRASS","FIGHTING"],6,10,7,7,"Poison Heal",""],["Loudred",["NORMAL"],9,8,4,5,"Soundproof",""],["Salamence",["DRAGON","FLYING"],10,12,8,10,"Intimidate","Moxie"]]},{"n":"Trainer Noah","at":"Endigio League Conference","e":"","rw":"","o":2,"i":2,"wl":2,"nt":"","m":[["Crobat",["POISON","FLYING"],9,8,8,13,"Inner Focus",""],["Golem",["ROCK","GROUND"],8,8,10,5,"Sturdy",""],["Dewgong",["WATER","ICE"],9,8,9,7,"Hydration",""],["Scizor",["BUG","STEEL"],7,10,9,7,"Technician","Light Metal"],["Aggron",["STEEL","ROCK"],7,8,12,5,"Rock Head","Heavy Metal"],["Pawmot",["ELECTRIC","FIGHTING serves in Kanto and Hoenn, the Austra Safari Zone features a Safari Game where Trainers must try to catch the Pokémon without harming it.","it":["Black Apricorn","Blue Apricorn","Green Apricorn","Pink Apricorn","Red Apricorn","White Apricorn","Yellow Apricorn","Aspear Berry","Belue Berry","Cheri Berry","Cornn Berry","Durin Berry","Magost Berry","Nomel Berry","Oran Berry","Pamtre Berry","Rabuta Berry","Spelon Berry","Wepear Berry"],"ev":[{"t":"Safari Game","r":"₽2000","q":{"cost":2000},"d":"A unique game held by the safari zone that allows for trainers to catch Pokémon that would be difficult to find elsewhere in the region. Trainers are given 10 Safari Balls (Only Safari Balls can be used in the Safari Zone) and 10 stones and 10 pieces of bait. Player can compete until they have run out of Safari Balls. Trainers will roll for an encounter and select a Pokémon from the list of available options. Players can only choose from Pokémon that have a Total Base Stat that is less than the Trainers Obedience calculation (25 Total Base Stat or less plus 5 Base Stat for each Badge Allocated to Obedience). Instead of battling, Trainers have the option to use a Safari Ball, throw a stone, or use their bait. A stone can be thrown to decrease a Pokémon’s HP by 5, however each stone used allows the Pokémon 1 addition opportunity to flee each round. Bait can be thrown to decrease a Pokémon’s odds of fleeing each round, by re-rolling a successful flee attempt, however it increases a Pokémon’s Base Stat total by 10 for each bait used. To catch a Pokémon you must roll a 2d20 + 10 for the Trainer Accuracy Modifier. If that result is greater than the wild Pokémon’s Total Base Stats – 10 Safari Ball Modifier – (5 times number of Stones Used) + (10 times number of Bait Used), you caught the Pokémon."},{"t":"The Rockslide Déjà vu","r":"Have the Yellow Bow","q":{"cond":"Have the Yellow Bow"},"d":"While exploring the Safari Zone, you come across a clearing in the woods next to a large cliff. A ity Shield","Life Orb","Assault Vest"],"ev":[{"t":"The Secret Passage","r":"Have the Victory Feather","q":{"cond":"Have the Victory Feather"},"d":"As you are traveling through the maze that is Victory Road, you feel the ground beneath you begin to shake. In a panic you brace yourself but as the shaking subsides, you notice not a single light in the cave fell from the wall, and no ruble had dethatched from the ceiling. Instead a new passageway had immerged before you. As you travel this unexplored route, you approach an open room, filled with light. Inside is Victini, holding the Victory Feather that was supposed to be in your bag. Lose and it will teleport you to the entrance of Victory Road and without access to the Victory Feather, the secret passage will be lost forever. Victini can be captured."}],"wd":[[14,"Austran Arcanine",["ELECTRIC"],9,10,8,10,"Intimidate","Transistor","Justified",""],[14,"Austran Weezing",["POISON","FIRE"],7,8,10,6,"Levitate","Neutralizing Gas","White Smoke",""],[17,"Austran Tangrowth",["GROUND"],10,10,9,5,"Sand Veil","Sand Stream","Regenerator",""],[17,"Austran Starmie",["WATER","POISON"],6,8,9,12,"Poison Point","Natural Cure","Analytic",""],[17,"Austran Ariados",["DARK","POISON"],7,8,7,4,"Dark Aura","Insomnia","Sniper",""],[17,"Austran Ambipom",["NORMAL","PSYCHIC"],8,8,7,12,"Technician","Pickpocket","Skill Link",""],[14,"Ursaring",["NORMAL"],9,10,8,6,"Guts","Quick Feet","Unnerve",""],[14,"Austran Tyranitar",["GRASS","DARK"],10,12,11,7,"Grass Pelt","","Grassy Surge",""],[14,"Austran Sableye",["GHOST","STEEL"],5,8,7,5,"Keen Eye","Steely Spirit","",""],[17,"Klinklang",["STEEL"],6,8,10,9,"Plus","Minus","Clear Body",""]],"tr":[{"n":"Beauty Bella","at":"Near Route C04","e":"","rw":"₽1800","o":2,"i":0,"wl":0,"nt":"","m":[["Breloom",["GRASS","FIGHTING"],6,10,7,7,"Effect Spore",""],["Whimsicott",["GRASS","FAIRY"],6,8,8,12,"Infiltrator",""],["Tangrowth",["GRASS"],10,10,9,5,"Leaf Guard","Regenerator"]]},{"n":"Cool Trainer Declan","at":"Near Route C or levitating, and the goal is to be the first to retrieve the ring and place it on the goal post. Pokémon will start off 30 spaces away from the post, with the faster Pokémon getting the ring first, with ties decided by a coin toss. Pokémon will advance on the ring moving the number of spaces equal to their speed. The Pokémon holding the ring cannot attack, but the chasing Pokémon can. Instead of taking damage to HP, the attacked Pokémon will move backwards that amount of damage. If the Pokémon in the lead falls behind, possession of the ring is transferred. Being the first Pokémon to get to the post will win the contest. To play, pay the ticket price and select one of the competitors listed on the next pages."},{"t":"Pokémon Baccer","r":"₽600","q":{"cost":600},"d":"A game played between two teams of 3 Pokémon, played on a 11 x 11 grid, with a goal in the center tile. The first team to score 3 points win. Points are scored by attacking a large ball by rolling a d20. The ball has a DEF of 17 and anything less will miss. Your Damage roll will determine how many spaces the shot travels. For a shot to be successful, the Damage needs to be greater than the number of spaces between the shooting Pokémon and the Goal. Players can increase their attack roll by passing the ball between their Pokémon. To pass the ball, roll a d20, the roll must be higher than the ATK stat of the receiving Pokémon. Each successful pass adds a +1 to the next attack roll, as long as your team remains in possession of the ball. Passes can only be made in a straight or diagonal line. An unsuccessful pass will occur when your roll is less than the ATK stat of the receiving Pokémon. This will allow the opponent to move their nearest Pokémon to the space in the middle of the passing and receiving Pokémon, with control of the ball. The defending team can steal a pass if the Defense of their Pokémon within 1 space of the receiving Pokémon is higher than the pass roll. Pokémon cannot move with the ball. Each Pokémon can only move 2 spaces per turn and only one Pokémon can be moved per turn. The game begins with a coin toss to determine who gets the ball first. The player with the ball enters from one of the 4 corners of the grid. Players can place their remaining Pokémon anywhere else on the board initially, but can only be moved from there, if moved on their players turn. When a goal is scored, the other team gets the ball and can move one Pokémon to any corner to enter the ball back into play. To play, pay the ticket price and select one of the competitors listed on the next pages. Winning your first time will reward you with an item – Red Card."},{"t":"Double Battles","r":"₽400","q":{"cost":400},"d":"A double battle where each team only uses two Pokémon. The first team to knock out both opposing Pokémon wins. To battle, pay the ticket price and select one of the competitors listed on the next pages."}],"wd":[],"tr":[{"n":"PokéRinger Isaiah","at":"PokéRinger","e":"","rw":"","o":0,"i":0,"wl":0,"nt":"","m":[["Corvisquire",["FLYING"],7,6,6,8,"Keen Eye",""]]},{"n":"PokéRinger McKenzie","at":"PokéRinger","e":"","rw":"","o":0,"i":0,"wl":0,"nt":"","m":[["Pidgeotto",["NORMAL","FLYING"],7,6,5,8,"Keen Eye",""]]},{"n":"PokéRinger Louis","at":"PokéRinger","e":"","rw":"","o":0,"i":0,"wl":0,"nt":"","m":[["Fletchinder",["FIRE","FLYING"],7,6,5,9,"Flame Body",""]]},{"n":"PokéRinger Chase","at":"PokéRinger","e":"","rw":"","o":0,"i":0,"wl":0,"nt":"","m":[["Kilowattrel",["ELECTRIC","FLYING"],7,8,6,13,"Wind Power",""]]},{"n":"PokéRinger Rita","at":"PokéRinger","e":"","rw":"","o":0,"i":0,"wl":0,"nt":"","m":[["Golbat",["POISON","FLYING"],8,8,7,9,"Inner Focus",""]]},{"n":"PokéRinger Janet","at":"PokéRinger","e":"","rw":"","o":0,"i":0,"wl":0,"nt":"","m":[["Togetic",["FAIRY","FLYING"],6,6,10,4,"Hustle",""]]},{"n":"Team Beedrill","at":"Pokémon Baccer","e":"","rw":"","o":0,"i":0,"wl":0,"nt":"","m":[["Weedle",["BUG","POISON"],4,4,3,5,"Shield Dust",""],["Kakuna",["BUG","POISON"],5,4,4,4,"She o break one create each. Research Delivery – Lilly (Rank 2) – Assistant Fern has discovered some information that would greatly help Assistant Lilly, travel to Cairn Town to collect the research documents and then travel to Hobart City to deliver the documents to Assistant Lilly. The Eevee Fanatic – Jolteon (Rank 2) – The client wants to evolve his Eevee, but doesn't know which evolution to choose. Find a Trainer with a Jolteon and bring a picture back to him so he can show his Eevee the evolution to get her opinion. Once an \"The Eevee Fanatic\" mission has been completed, the rest of the missions will become unavailable. HQ Intel says a trainer with a Jolteon may be found on Route F06. Investigate Grotto Cave (Rank 3) – Some travelers that arrived in Cairn Town reported some strange noises coming from Grotto Cave. They believe its possible that an injured Musharna is in the cave. Acquire some medication and go investigate. Upon arrival you discover a massive monster almost unrecognizable as a Pokémon cornering the cowering Musharna. As you approach it, you step on a piece of driftwood that cracks, startling the monster, causing it to transform into a Zoroark. Defeat the Zoroark that is tormenting the Psychic Pokémon and has hurt the Musharna. Trouble on the Ranch (Rank 3) – Frontier Brain Sterling is away on business when a Miltank beings acting up. Go down to his Battle Ranch and capture Miltank. This will calm it down. Koffing Outbreak (Rank 3) – A civil engineering company has reach out regarding a massive outbreak of 10 Koffing in in the underground waterworks polluting the water. Theu have requested that we capture them all and remove them from the underground waterworks. After capturing the last Koffing, a Weezing will jump out and attack you. Must have Vileplume (Rank 3) – The client has requested that you bring her a Vileplume to help her take care of the pest stealing from her garden. Capture one on Route G03 and bring it to Perth Town. Research Delivery – Hazel (Rank 3) – Assistant Lilly has discovered some information that would greatly help Assistant Hazel, travel to Hobart City to collect the research documents and the travel to Tomba Town to deliver the documents to Assistant Hazel. The Eevee Fanatic – Flareon (Rank 3) – The client wants to evolve his Eevee, but doesn't know which evolution to choose. Find a Trainer with a Flareon and bring a picture back to him so he can show his Eevee the evolution to get her opinion. Once an \"The Eevee Fanatic\" mission has been completed, the rest of the missions will become unavailable. HQ Intel says a trainer with a Flareon may be found on Route F06. Missions For the Love of Fungus (Rank 4) – A Herbologist is looking for some fungi Grass-Type Pokémon to study the effects of their spores for medical purposes. Capture either a Morelull or a Shroomish and bring it to her for her studies. Capture one on either Route G01 or in the Whimsical Woods and bring it to Ballarat City. Where did Lombre Go? (Rank 4) – The client Lombre has gone missing. Last she saw it, was when Lombre was helping her serve tables at here outdoor café. She got swamped with orders and when she finally has a moment to breath, it appeared that Lombre wondered off. She notes that Lombre likes natural music. Bring a Kricketune to Townsville to help draw out the missing Pokémon. Nanab Crazy (Rank 4) – The client has lost his Aipom, he believes that his Aipom may have left Ballad Town and gone looking for some Nanab Berries near route G02. When you find Aipom, its shaking a Naban Tree and disturbs 4 Beedrill. Calm or defeat the Beedrill to protect the Aipom. Recover the Lost Keys (Rank 4) – A sailor has put in a request from Melbouboro that a Dondozo & Tatsugiri have teamed up and are stealing from travelers on Route F09. He has requested that we investigate and The Dondozo and Tatsugirir duo can't be captured. Recruit Pokémon on standby for a Double Battle against the duo. Research Delivery – Fern (Rank 4) – Assistant Hazel has discovered some information that would greatly help Assistant Fern, travel to Tomba Town to collect the research documents and then travel to Cairn Town to deliver the documents to Assistant Lilly. The Eevee Fanatic – Espeon (Rank 4) – The client wants to evolve his Eevee, but doesn't know which evolution to choose. Find a Trainer with a Espeon and bring a picture back to him so he can show his Eevee the evolution to get her opinion. Once an \"The Eevee Fanatic\" mission has been completed, the rest of the missions will become unavailable. HQ Intel says a trainer with a Espeon may be found on Route C02. The Quakes – Part 1 (Rank 5) – There have been reports from Townsville City over unnatural earthquakes that seem to be originating from Route W03. Upon arrival you discover some very out of place three Hippopotas and a Hippowdon causing an uproar. Capture them to calm them down. The Hippowdon MIgration – Part 2 (Rank 5, Complete The Quakes) – After capturing the wild Hippopotas and a Hippowdon, you report back to HQ who tells you that you need to transport these Pokémon back to their natural habitat on Route F07. They have informed a Top Ranger who is out on a mission in Flame County and she will rendezvous with you at the corner of Route W05 & W06 to escort you across the Barrier River and to Route F07. Upon arrival on Route F07 a Rampardos will attack the Hippowdon for returning. Capture it to quell the fighting. Missions Clear The Rockslide (Rank 5) – A rockslide has occurred at the boarder of Route G01 and Route C03. Gather 3 Fighting Types with an Attack of 8 or Higher to clear the debris. After clearing the rocks, your attacked by the Golem that caused the incident. Calm or defeat the Golem. Oddish Research (Rank 5) – The client is a Youngster who wants to be a scientist and wants to see an Oddish for the first Pokémon he wants to study. Capture one on either Route G01 or G03 and bring it to Melbouboro. Secure the Hidden Cavern (Rank 5) – A citizen in Cairn Town has reported a possible fire inside the Hidden Cavern on Route W09. Smoke can be seen from the town coming from the direction of the cavern. Capture 3 Water Types with an attack of 8 or more to assist in putting out the fires. As you put out the flames you notice a Magmortar, Magmar and two baby Magby in the back of the Cavern who seem to have gotten trapped down here which is why they started the fires. Capture the Magmortar and Magmar to calm down the group so that the family of Fire Types can find their way back to the tunnel that led them to the cavern. The Eevee Fanatic – Umbreon (Rank 5) – The client wants to evolve his Eevee, but doesn't know which evolution to choose. Find a Trainer with a Umbreon and bring a picture back to him so he can show his Eevee the evolution to get her opinion. Once an \"The Eevee Fanatic\" mission has been completed, the rest of the missions will become unavailable. HQ Intel says a trainer with a Umbreon may be found on Route C01. Snow in Sydney (Rank 6) – The client is a children's hospital in Sydney City. The director wants it to snow at the Hospital for the children and as such wants you to bring two of the strong ice Pokémon back. These are Froslass and Glalie, both of which are found on Route W07. Once you return with them, you will be taken to the Hospital's outdoor courtyard to make it snow for the children. The Ice Barrier (Rank 6) – A client has reported that a giant ball of ice is blocking the way on Route G09 near Snowshine Port. Capture a Pokémon attack of 10 or higher to break the ice The Wanderer (Rank 6) – A senior citizen has wandered into the deepest part of the Haunted Forest where humans rarely set foot. The elderly needs to be rescued as soon as possible. The client is surrounded by four Nuzleaf and a Shiftry. Capture them so you can rescue the old man. Monster at the Plant – Part 1 (Rank 6) – The President of the Power Plant has reached out as something has been stalking the factory at night leaving claw marks on the walls and equipment and wants the Rangers to investigate. When you arrive the power has been cut and the Electric Pokémon have all scattered around the factory. Capture 5 Electric Types to bring back to the generator room. Monster at the Plant – Part 2 (Rank 6) – With the lights back on at the plant, you see some sharp claw marks on several of the machines. As you follow the marks they lead you into the basement, which appears to have also lost power. Have at least 1 Electric Type on standby so that you can use their electricity to light up the room. Now that you can see you enter the room where you see a startled and flustered Lycanroc Midnight Form. Capture it so you can remove it from the Plant. Missions The Eevee Fanatic – Leafeon (Rank 6) – The client wants to evolve his Eevee, but doesn't know which evolution to choose. Find a Trainer with a Leafeon and bring a picture back to him so he can show his Eevee the evolution to get her opinion. Once an \"The Eevee Fanatic\" mission has been completed, the rest of the missions will become unavailable. HQ Intel says a trainer with a Leafeon may be found on Route W05. Aquarium Delivery (Rank 7) – Sydney Zoo is requesting a Ranger to help capture 5 different water Pokémon with a Base Total of 30 or less for the Zoo's new aquarium. These Pokémon will be used to ensure the facility meets the needs of the Pokémon before they start bringing injured Water Types there for recovery and rehab. Bring the 5 Captured Water Pokémon to Sydney City. Clear Some Fallen Logs (Rank 7) – Just north of Waga Town on Route W04, some fallen trees are blocking the path. Capture a Timburr, Gurdurr, and Conkeldurr to help clear out the Fallen Logs. Gift of Music for Isaac (Rank 7) – In Adela City, you will find a girl who wants to perform with four musical Pokémon for her elderly grandfather Issac. These are Jigglypuff, Loudred, Kricketune, & Ludicolo. Capture the 4 Pokemon for the girl. You can find and capture these Pokémon on the following locations: Route G07, W04, W05, W10, C01. The Eevee Fanatic – Glaceon (Rank 7) – The client wants to evolve his Eevee, but doesn't know which evolution to choose. Find a Trainer with a Glaceon and bring a picture back to him so he can show his Eevee the evolution to get her opinion. Once an \"The Eevee Fanatic\" mission has been completed, the rest of the missions will become unavailable. HQ Intel says a trainer with a Glaceon may be found on Route W07. A Sleepy Friend (Rank 8) – In a farmhouse located near the Battle Ranch, a terminally ill child has been complaining to his parents that he is lonely so the client has contacted us as she wishes to get a Slakoth for her child so he someone who will just lay around with him all day. Capture one on either Route C04 or C08 and bring it to Long City. The Eevee Fanatic – Sylveon (Rank 8) – The client wants to evolve his Eevee, but doesn't know which evolution to choose. Find a Trainer with a Sylveon and bring a picture back to him so he can show his Eevee the evolution to get her opinion. Once an \"The Eevee Fanatic\" mission has been completed, the rest of the missions will become unavailable. HQ Intel says a trainer with a Sylveon may be found on Route G03. The Broken Artifact (Rank 8) – The client is an Archaeologist named Dr. Henry Jones who has requested a Ranger escort as he hunts for the 3 pieces of an artifact that have been scattered around the region. Dr. Jones believes that the treasure was not lost but intentionally hidden by the ancient rulers of the region and believes he has discovered clues written back in ancient times during the Austra Monarchy. These clues create a map to the possible whereabouts of each. Help solve the clues and escort Dr. Jones to each location: answers can be found on the bottom of the next page. - You will find me in the shade of the lush green. - From this alter was granted our deepest desires. - From here I control all, from sea to sea. After collecting the 3 pieces, Dr. Jones combines them to create an object that looks like an ancient Pokéball. While it doesn’t work, he is going to take it to the Ali Spring Museum where it can be on display for the whole world to see and admire. The Strange Crates – Part 1 (Rank 9) – The client has requested that we send someone to investigate a mysterious steel box that were floating by Mirage Port. Capture a Pokémon with a type advantage against Steel that can deal 12 or more damage in a single attack. The box appears to be a storage container used by the Mafia. Missions Pokémon Emergency – Part 2 (Rank 9, Complete The Strange Crates) – Trapped inside of the crate was a weak and injured Axew that must have fallen off one of their black market shipments to another region. Transport it to the Pokémon Care Facility in Sydney City. On Route F02 you will be attacked by 3 Mafia grunts attempting to retrieve their asset. Defeat them to ensure the Axew makes it to the Zoo safely. Mafia Grunt (F) – Route F02 Reward: ₽250 Obedience: 0, Intuition: 1, Will: 0 Mafia Grunt (M) – Route F02 Reward: ₽250 Obedience: 1, Intuition: 0, Will: 0 Mafia Grunt (F) – Route F02 Reward: ₽250 Obedience: 0, Intuition: 1, Will: 0 MIA: Cradle Mountain Hiker (Rank 9) – A client from Peak Town has put in a request as her husband has gone missing on Cradle Mountain. Last she had heard from him, he came across a few baby Noibat. After confirming with Frontier Brain Rory about possible threats on the Mountain, HQ has concluded that the client was most likely attacked by the mama Noivern and taken him to her den. Go to Cradle Mountain and capture the Noivern so the client can be rescued. The Cryptic Warning (Rank 10) – A cryptic warning message was received at Ranger HQ. You are being sent to Berra to talk to the old shop keeper. In a small run down antique store, sits an elderly blind woman. As you enter the store, she immediately identifies you as a person with a strong aura. She proclaims that it was fate that you visited and offers you one of her sacred treasures from the back. The old lady offers you the choice of one of the following items: Prison Bottle, Cracked Jewel, Mysterious Box, The Sea Crown, Wish Crystal, Ancient Sword, Yellow Bow, Victory Feather, Yo-Yo, Mysterious Egg, Soul-Heart, or Red Shoes. She then warns you that fate is about to be overwritten. Finding Where to Go (Rank 10, Complete The Cryptic Warning) – After receiving the old woman's \"sacred treasure\" you receive a call from Ranger IQ that a Bounty Hunter for the mafia has been spotted in an area where a Mythical Pokémon has been rumored to be found. Find the location based on the item you received from the shop keeper. - Mirage Desert - Grotto Cave - Castle Ruins Missions Protecting the Future (Rank 10, Complete Finding Where to Go) – Upon arriving where the Mythical Item has guided you, you will find that a Bounty Hunter is using machines and weapons to try and forcefully capture the Mythical Pokémon that lives there. You must use the Pokémon you have on Standby to defeat the Bounty Hunter in a Battle using your Standby Pokémon and drive her back. Bounty Hunter Domino Reward: ₽3,500 Obedience: 3, Intuition: 0, Will: 4 Capturing a Myth (Rank 10, Complete Protecting the Future) – After driving back the Bounty Hunter you see that the Mythical Pokémon has been severely injured. You will need to capture it to earn its trust so that you can heal it. P2 P2","it":[],"ev":[],"wd":[],"tr":[]}],"natures":[{"roll":1,"cat":"Amped","name":"Adamant","cool":10.5,"beauty":7.0,"cute":1.5,"clever":4.5,"tough":6.5,"likes":"Spicy","dislikes":"Dry"},{"roll":2,"cat":"Amped","name":"Brave","cool":12.0,"beauty":7.0,"cute":-0.5,"clever":3.5,"tough":8.0,"likes":"Spicy","dislikes":"Sweet"},{"roll":3,"cat":"Amped","name":"Docile","cool":6.0,"beauty":2.5,"cute":5.0,"clever":7.0,"tough":9.5,"likes":"N/A","dislikes":"N/A"},{"roll":4,"cat":"Amped","name":"Hardy","cool":2.5,"beauty":2.0,"cute":4.0,"clever":11.0,"tough":10.5,"like function dkey(n) {
  return String(n || "").replace(/♀/g, " Female").replace(/♂/g, " Male").replace(/\bAust\.\s*/g, "Austran ").replace(/\bAustrian\b/g, "Austran")
    .replace(/\s+Forme?\b/g, "").replace(/\s+/g, " ").trim().toLowerCase();
}
const DEXMAP = new Map();

DEXMAP.set("gimmighoul", DEXMAP.get("gimmighoul chest"));
function dexFind(n) { return DEXMAP.get(dkey(n)) || null; }
function evolutionsOf(name) {
  const k = dkey(name);
  const base = k.replace(/ (chest|roaming)$/, "");
  return DEX.filter((d) => d.evoFrom && (dkey(d.evoFrom) === k || dkey(d.evoFrom).replace(/ \(either form\)$/, "") === base) && !/^Mega |Mega /.test(d.name));
}
function megaOf(name) {
  const base = dkey(name);
  return DEX.find((d) => /Mega /.test(d.name) && dkey(d.name.replace("Mega ", "")) === base) || null;
}

/* ---------- derived trainer numbers ---------- */
function awardList() {
  const out = [];
  for (const [id, a] of Object.entries(S.awards)) if (a && a.on) out.push({ id, kind: id.split(":")[0], ...a });
  return out.sort((x, y) => (x.at || 0) - (y.at || 0));
}
function statValue(k) { let n = 0; for (const a of awardList()) n += (a.alloc || []).filter((s) => s === k).length; return n; }
function statsAll() { const o = {}; STATS.forEach((s) => (o[s.k] = statValue(s.k))); return o; }
function pointsSpent() { return awardList().reduce((n, a) => n + (a.alloc || []).length, 0); }
function pointsPending() {
  // points each award may still hand out, respecting the 20-point total cap (earliest awards first)
  let spent = pointsSpent(), pending = 0;
  for (const a of awardList()) {
    const want = awardPoints(a.kind) - (a.alloc || []).length;
    const room = Math.max(0, STAT_CAP - spent - pending);
    pending += Math.min(want, room);
  }
  return pending;
}
function awardRoom(a) {
  const others = pointsSpent() - (a.alloc || []).length;
  return Math.max(0, Math.min(awardPoints(a.kind), STAT_CAP - others));
}

}

/* Generic reader for plain, unconditional effect text, e.g. "+2 to Attack Roll." */
function plainFx(text) {
  const t = String(text || "").trim();
  const o = {};
  let m;
  if ((m = t.match(/^([+-]\d+) to (?:the )?Attack Rolls?\.?$/i))) o.atk = +m[1];
  if ((m = t.match(/^([+-]\d+) to Damage Rolls?\.?$/i))) o.dmg = +m[1];
  if ((m = t.match(/^([+-]\d+) to Defense\.?$/i))) o.def = +m[1];
  if ((m = t.match(/^([+-]\d+) to Speed\.?$/i))) o.spd = +m[1];
  return o;
}

/* Item effects read from the Item Dex text */
function itemFx(name) {
  const it = itemFind(name);
  if (!it) return {};
  const d = it.desc, o = { name: it.name, text: d };
  let m;
  if ((m = d.match(/^\+(\d+) to Attack Rolls? for (\w+)-type moves/i))) o.atkType = { [m[2].toUpperCase()]: +m[1] };
  if ((m = d.match(/^\+(\d+) to Damage Rolls? of the holder's first (\w+)-type move/i))) o.gem = { type: m[2].toUpperCase(), v: +m[1] };
  if ((m = d.match(/^\+(\d+) to Damage Rolls?, but holders? takes? (\d+) recoil/i))) { o.dmg = +m[1]; o.recoil = +m[2]; }
  if ((m = d.match(/^-(\d+) to opposing Pokémon's Attack Rolls/i))) o.foeAtk = -m[1];
  if ((m = d.match(/changes the Weather to (\w+)/i))) o.entry = { weather: m[1] };
  if ((m = d.match(/changes the Terrain to (\w+)/i))) o.entry = { terrain: m[1] === "Water" ? "Wet" : m[1] };
  if ((m = d.match(/Extends the duration of (\w+)/i))) o.extend = m[1].toLowerCase();
  if ((m = d.match(/Pokémon can now use (\w+)-type moves/i))) o.extraType = m[1].toUpperCase();
  if (/deal 1 damage to the attacker/i.test(d)) o.helmet = 1;
  if (/immunity to weather-related damage/i.test(d)) o.goggles = true;
  if ((m = d.match(/Restore (\d+) HP per turn when held by a Poison-type/i))) o.sludge = true;
  Object.assign(o, plainFx(d));

}

/* ---------- fighters ---------- */
function makeFighter(src, side) {
  // src: {name, sp, types, hp, atk, def, spd, abilities[], ability, item, gender, monId, status}
  const d = dexFind(src.sp || src.name);
  const f = {
    key: uid(), side, name: src.name, sp: src.sp || src.name, types: (src.types && src.types.length ? src.types : d ? d.types : ["NORMAL"]).slice(),
    base: { hp: src.hp, atk: src.atk, def: src.def, spd: src.spd }, maxHp: src.hp, hp: src.curHp != null ? src.curHp : src.hp,
    abilities: (src.abilities || [src.ability]).filter(Boolean), ability: src.ability || (src.abilities || [])[0] || "",
    item: src.item || "", gender: src.gender || "", status: src.status || "", statusTurns: 0, vol: {}, monId: src.monId || null,
    boost: { atk: 0, dmg: 0, def: 0, spd: 0 }, manual: { atk: 0, dmg: 0, def: 0, spd: 0 }, taken: 0, fainted: (src.curHp === 0), mega: false, dmax: 0,
    gemUsed: false, entered: false, acted: false, extraType: "",
  };
  f.bst = f.base.hp + f.base.atk + f.base.def + f.base.spd;
  return f;
}
function fx(f) { return f && f.ability ? AFX[f.ability] || plainFx(abText(f.ability)) : {}; }
function ifx(f) { return f && f.item && !(f.vol && f.vol.Embargo) ? itemFx(f.item) : {}; }
function trainerOf(B, f) { return B.sides[f.side].trainer; }
function activeOf(B, side) { return B.sides[side].active.map((i) => B.sides[side].mons[i]).filter(Boolean); }
function foeSide(s) { return s === "me" ? "foe" : "me"; }
function allActive(B) { return activeOf(B, "me").concat(activeOf(B, "foe")); }

function statusBlocked(B, f, status) {
  const a = fx(f);
  if (a.prevents && a.prevents.includes(status)) return f.ability;
  if (a.preventsIf && a.preventsIf(B).includes(status)) return f.ability;
  if (status === "Poison" && (isType(f, "POISON") || isType(f, "STEEL"))) return f.types.join("/") + " type";
  return "";
}
function inflict(B, f, status, source) {
  if (!f || f.fainted) return "";
  const block = statusBlocked(B, f, status);
  if (block) return `${f.name} is protected from ${status} (${block}).`;
  if (PERSISTENT.includes(status)) {
    if (f.status) return `${f.name} already has ${f.status}.`;
    f.status = status; f.statusTurns = STATUS_TURNS[status] || 0;
  } else {
    const vols = Object.keys(f.vol);
    if (vols.length && !vols.includes(status)) return `${f.name} already has ${vols[0]} (one volatile condition at a time).`;
    f.vol[status] = STATUS_TURNS[status] || 99;
  }
  return `${f.name} is now affected by ${status}${source ? " (" + source + ")" : ""}.`;
}

/* ---------- speed & order ---------- */
function speedOf(B, f) {
  const parts = [{ l: "Speed", v: f.base.spd }];
  const ctx = { me: f, B };
  if (weatherOn(B) === "Snow" && isType(f, "ICE")) parts.push({ l: "Snow (Ice-type)", v: 2 });
  const a = fx(f);
  if (a.spd) { const v = typeof a.spd === "function" ? a.spd(ctx) : a.spd; if (v) parts.push({ l: f.ability, v }); }
  const it = ifx(f); if (it.spd) parts.push({ l: f.item, v: it.spd });
  if (f.boost.spd) parts.push({ l: "Battle boosts", v: f.boost.spd });
  if (f.manual.spd) parts.push({ l: "Manual", v: f.manual.spd });
  return { v: parts.reduce((n, p) => n + p.v, 0), parts };
}
function turnOrder(B) {
  return allActive(B).filter((f) => !f.fainted).map((f) => ({ f, s: speedOf(B, f).v, dmax: f.dmax > 0 }))
    .sort((a, b) => (b.dmax - a.dmax) || (b.s - a.s) || (b.f.bst - a.f.bst)).map((x) => x.f);
}

/* ---------- defense ---------- */
function defenseOf(B, def, att) {
  const parts = [{ l: "Defense", v: def.base.def }];
  const a = fx(def);
  if (a.defZero) return { v: 0, parts: [{ l: "No Guard sets Defense to 0", v: 0 }] };
  const tr = trainerOf(B, def);
  if (tr && tr.intuition) parts.push({ l: "Trainer Intuition", v: tr.intuition });
  const w = weatherOn(B);
  if (w === "Fog") parts.push({ l: "Fog", v: 1 });
  if (w === "Hail" && isType(def, "ICE")) parts.push({ l: "Hail (Ice-type)", v: 1 });
  if (w === "Sandstorm" && isType(def, "ROCK")) parts.push({ l: "Sandstorm (Rock-type)", v: 1 });
  if (a.def) { const v = typeof a.def === "function" ? a.def({ me: def, foe: att, B }) : a.def; if (v) parts.push({ l: def.ability, v }); }
  if (isType(def, "FIRE") && allActive(B).some((f) => !f.fainted && fx(f).fieldFireDef)) parts.push({ l: "Damp on the field (Fire-type)", v: -1 });
  const it = ifx(def); if (it.def) parts.push({ l: def.item, v: it.def });
  if (def.vol.Identified) parts.push({ l: "Identified", v: -3 });
  if (def.boost.def) parts.push({ l: "Battle boosts", v: def.boost.def });
  if (def.manual.def) parts.push({ l: "Manual", v: def.manual.def });
  return { v: parts.reduce((n, p) => n + p.v, 0), parts };
}

/* ---------- attack roll modifiers ---------- */
function attackMods(B, att, def, attType) {
  const parts = [];
  const tr = trainerOf(B, att);
  const keen = fx(att).keenEye;
  const push = (l, v) => { if (!v) return; if (v < 0 && keen) { parts.push({ l: l + " (blocked by Keen Eye)", v: 0 }); return; } parts.push({ l, v }); };
  if (tr && tr.hasTrainer) {
    const c = obedCap(tr.obedience);
    if (att.bst > c) push(`Obedience: Base Stat Total ${att.bst} is over the limit of ${c}`, -5);
    else if (tr.obedience) push(`Obedience ${tr.obedience} (within limit ${c})`, tr.obedience);
  }
  const w = weatherOn(B);
  if (w === "Sunshine") { if (attType === "FIRE") push("Sunshine (Fire)", 1); if (attType === "WATER") push("Sunshine (Water)", -1); }
  if (w === "Rain") { if (attType === "WATER") push("Rain (Water)", 1); if (attType === "FIRE") push("Rain (Fire)", -1); }
  if (w === "Windy" && isType(def, "FLYING")) push("Windy vs Flying-type", -1);
  const tt = TERRAIN_TYPES[B.terrain];
  if (tt && tt.includes(attType)) push(`${B.terrain} Terrain (${cap(attType)})`, 2);
  const a = fx(att);
  if (a.atk) push(att.ability, typeof a.atk === "function" ? a.atk({ me: att, foe: def, B, attType }) : a.atk);
  const it = ifx(att);
  if (it.atkType && it.atkType[attType]) push(att.item, it.atkType[attType]);
  if (it.atk) push(att.item, it.atk);
  const dit = ifx(def); if (dit.foeAtk) push(`${def.name}'s ${def.item}`, dit.foeAtk);
  if (att.boost.atk) push("Battle boosts", att.boost.atk);
  if (att.manual.atk) push("Manual", att.manual.atk);
  return parts.filter((p) => p.v !== 0 || /blocked/.test(p.l));
}

/* ---------- damage die (Attack stat) ---------- */
function attackDie(B, att) {
  let die = att.base.atk, notes = [];
  for (const f of activeOf(B, foeSide(att.side))) {
    if (f.fainted || !fx(f).foeAtkStat) continue;
    const a = fx(att);
    if (a.noIntimidate) { notes.push(`${att.ability} ignores ${f.name}'s Intimidate`); continue; }
    if (a.flipIntimidate) { die += 2; notes.push(`Guard Dog turns ${f.name}'s Intimidate into +2`); continue; }
    if (a.keenEye) { notes.push(`Keen Eye blocks ${f.name}'s Intimidate`); continue; }
    die -= 2; notes.push(`${f.name}'s Intimidate −2`);
  }
  return { die: Math.max(1, die), notes };
}

/* ---------- full attack resolution ---------- */
function resolveAttack(B, att, def, opt) {
  const attType = opt.attType || att.types[0];
  const lines = [];
  const out = { att, def, attType, lines, hit: false, dmg: 0, events: [] };
  // can it act?
  if (att.status === "Sleep" || att.status === "Freeze") { lines.push(`${att.name} is ${att.status === "Sleep" ? "asleep" : "frozen"} and can't move (${att.statusTurns} turn${att.statusTurns === 1 ? "" : "s"} left).`); out.blocked = true; return out; }
  const missChecks = [];
  if (att.status === "Paralysis") missChecks.push(["Paralysis", 3]);
  if (att.vol.Flinch) missChecks.push(["Flinch", 3]);
  if (att.vol.Infatuation && att.gender && def.gender && att.gender !== def.gender) missChecks.push(["Infatuation", 3]);
  if (att.vol.Confusion) missChecks.push(["Confusion", 2]);
  for (const [nm, n] of missChecks) {
    const r = opt.statusRolls && opt.statusRolls[nm] != null ? opt.statusRolls[nm] : rnd(10);
    lines.push(`${nm}: d10 = ${r} (misses on ${n} or lower)`);
    if (r <= n) {
      out.statusMiss = nm;
      if (nm === "Confusion") { out.events.push({ f: att, dmg: 1, why: "hurt itself in confusion" }); }
      lines.push(`→ ${att.name}'s attack fails.`);
      return out;
    }
  }
  const d = defenseOf(B, def, att);
  const mods = attackMods(B, att, def, attType);
  const modSum = mods.reduce((n, p) => n + p.v, 0);
  const nat = opt.d20 != null ? opt.d20 : rnd(20);
  const noCrit = fx(def).noCrit;
  const natUsed = nat === 20 && noCrit ? 19 : nat;
  const total = natUsed + modSum;
  const need = d.v + 1;
  out.nat = nat; out.total = total; out.need = need; out.mods = mods; out.defParts = d.parts;
  lines.push(`Attack roll: d20 = ${nat}${nat === 20 && noCrit ? ` (→ 19, ${def.ability})` : ""}` + mods.map((p) => ` ${p.v >= 0 ? "+" : "−"} ${Math.abs(p.v)} ${p.l}`).join("") + ` = ${total}`);
  lines.push(`Needs ${need}+ (${def.name}'s Defense ${d.parts.map((p) => (p.v >= 0 ? "+" : "−") + Math.abs(p.v) + " " + p.l).join(" ").replace(/^\+/, "")} = ${d.v}, +1)`);
  const auto = fx(att).noMiss;
  if (total < need && !auto) { lines.push(`→ Miss.`); return out; }
  if (total < need && auto) lines.push(`${att.ability}: the attack can't miss.`);
  out.hit = true;
  const crit = (nat === 20 || (nat === 19 && fx(att).crit19)) && !noCrit;
  out.crit = crit;
  // immunity / absorb
  const dfx = fx(def);
  let mult = typeMult(attType, def.types);
  const ctx = { me: att, foe: def, B, attType, crit, mult };
  if (dfx.immune && dfx.immune(ctx)) { lines.push(`${def.name}'s ${def.ability}: immune to ${cap(attType)}-type attacks.`); out.dmg = 0; out.immune = true; return out; }
  // damage dice
  const die = attackDie(B, att);
  die.notes.forEach((n) => lines.push(n));
  const afx = fx(att);
  let rolls = [];
  if (opt.dmgRolls && opt.dmgRolls.length) rolls = opt.dmgRolls.slice();
  let base;
  if (afx.dice === 2) {
    while (rolls.length < 2) rolls.push(rnd(die.die));
    base = rolls[0] + rolls[1];
    lines.push(`Damage: 2d${die.die} (${att.ability}) = ${rolls[0]} + ${rolls[1]} = ${base}`);
  } else {
    if (!rolls.length) rolls.push(rnd(die.die));
    base = rolls[0];
    lines.push(`Damage: d${die.die} = ${base}`);
  }
  out.rolls = rolls; out.die = die.die;
  const flat = [];
  if (crit) flat.push({ l: "natural 20", v: 1 });
  if (opt.zmove) { flat.push({ l: "Z-Move", v: 3 }); lines.push(`Z-Move with ${att.item}: +3 to the Damage Roll.`); }
  if (afx.dmg) { const v = typeof afx.dmg === "function" ? afx.dmg(ctx) : afx.dmg; if (v) flat.push({ l: att.ability, v }); }
  const it = ifx(att);
  if (it.dmg) flat.push({ l: att.item, v: it.dmg });
  if (it.gem && it.gem.type === attType && !att.gemUsed) { flat.push({ l: att.item + " (used up)", v: it.gem.v }); out.gemUsed = true; }
  if (dfx.inFlat) { const v = dfx.inFlat(ctx); if (v) flat.push({ l: `${def.name}'s ${def.ability}`, v }); }
  if (att.boost.dmg) flat.push({ l: "Battle boosts", v: att.boost.dmg });
  if (att.nextDmg) { flat.push({ l: "Wind Power charge", v: att.nextDmg }); out.usedNextDmg = true; }
  if (att.manual.dmg) flat.push({ l: "Manual", v: att.manual.dmg });
  const pre = Math.max(0, base + flat.reduce((n, p) => n + p.v, 0));
  if (flat.length) lines.push(`Flat: ${flat.map((p) => (p.v >= 0 ? "+" : "−") + Math.abs(p.v) + " " + p.l).join(", ")} → ${pre}`);
  const typeM = mult;
  if (dfx.inMult) mult = dfx.inMult(ctx, mult);
  lines.push(`Type: ${cap(attType)} vs ${def.types.map(cap).join("/")} ×${typeM}${mult !== typeM ? ` → ×${mult} (${def.ability})` : ""}`);
  let dmg = Math.floor(pre * mult);
  if (dfx.absorb && dfx.absorb === attType) {
    out.absorb = { into: dfx.into, v: dmg };
    lines.push(`${def.name}'s ${def.ability} absorbs it: ${dfx.into === "heal" ? "restores " + dmg + " HP" : dfx.into === "atk" ? "+" + dmg + " to its Attack Rolls" : "+" + dmg + " Speed"}.`);
    out.dmg = 0; return out;
  }
  if (attType === "FIRE" && def.ability === "Flash Fire") { /* handled by absorb */ }
  // survive checks
  const full = def.hp === def.maxHp;
  if (dmg >= def.hp && full && dfx.sturdy) { lines.push(`${def.ability}: survives at 1 HP.`); dmg = def.hp - 1; out.survived = "Sturdy"; }
  else if (dmg >= def.hp && full && crit) {
    const tr = trainerOf(B, def);
    if (tr && tr.will > 0) {
      const r = opt.willRoll != null ? opt.willRoll : rnd(6);
      lines.push(`Will check: d6 = ${r} (needs ≤ ${tr.will})`);
      if (r <= tr.will) { dmg = def.hp - 1; out.survived = "Will"; lines.push(`→ ${def.name} hangs on with 1 HP.`); }
    }
  }
  out.dmg = dmg;
  lines.push(`→ ${dmg} damage${dmg >= def.hp ? " — " + def.name + " faints" : ""}.`);
  // after-damage effects

    const recoil = (afx.recoil || 0) + (it.recoil || 0);
    if (recoil && !fx(att).noIndirect) out.events.push({ f: att, dmg: recoil, why: "recoil" });
    const dit = ifx(def);
    if (dit.helmet && !fx(att).noIndirect) out.events.push({ f: att, dmg: dit.helmet, why: def.item });
    const contact = (src, tgt, a, when) => {
      if (!a.contact) return;
      if (!(a.when === "both" || a.when === when)) return;
      if (a.chance && Math.random() >= a.chance) return;
      out.events.push({ f: tgt, status: a.contact, why: `${src.name}'s ${src.ability}` });
    };
    if (dfx.afterHit) { const g = dfx.afterHit(ctx); if (g && g.atk) { def.boost.atk += g.atk; lines.push(`${def.name}'s ${def.ability}: +${g.atk} to Attack Rolls.`); } if (g && g.nextDmg) { def.nextDmg = (def.nextDmg || 0) + g.nextDmg; lines.push(`${def.name}'s ${def.ability}: +${g.nextDmg} to its next Damage Roll.`); } }
    if (dfx.lingering && att.ability !== "Lingering Aroma") { lines.push(`${att.name}'s ${att.ability} is replaced with Lingering Aroma.`); att.origAbility = att.origAbility || att.ability; att.ability = "Lingering Aroma"; }
    contact(att, def, afx, "deal");
    contact(def, att, dfx, "take");
    if (afx.spore) { const r = rnd(6); const st = { 1: "Poison", 2: "Sleep", 3: "Paralysis" }[r]; lines.push(`Effect Spore: d6 = ${r}${st ? " → " + st : " → nothing"}`); if (st) out.events.push({ f: def, status: st, why: "Effect Spore" }); }
  }
  return out;
}

/* ---------- probability (for the quick calculator) ---------- */
function attackOdds(B, att, def, attType) {
  const d = defenseOf(B, def, att).v;
  const mods = attackMods(B, att, def, attType).reduce((n, p) => n + p.v, 0);
  const need = d + 1 - mods;
  const noCrit = fx(def).noCrit;
  let hit = 0;
  for (let r = 1; r <= 20; r++) { const n = r === 20 && noCrit ? 19 : r; if (n + mods >= d + 1 || fx(att).noMiss) hit++; }
  const die = attackDie(B, att).die;
  const ctx = { me: att, foe: def, B, attType, crit: false, mult: typeMult(attType, def.types) };
  let mult = ctx.mult; const dfx = fx(def);
  if (dfx.inMult) mult = dfx.inMult(ctx, mult);
  if (dfx.immune && dfx.immune(ctx)) mult = 0;
  if (dfx.absorb === attType) mult = 0;
  const afx = fx(att), it = ifx(att);
  let flat = (typeof afx.dmg === "function" ? afx.dmg(ctx) : afx.dmg || 0) + (it.dmg || 0) + att.boost.dmg + att.manual.dmg + (dfx.inFlat ? dfx.inFlat(ctx) : 0);
  const dist = [];
  const dice = afx.dice === 2 ? 2 : 1;
  const faces = [];
  if (dice === 1) for (let i = 1; i <= die; i++) faces.push(i); else for (let i = 1; i <= die; i++) for (let j = 1; j <= die; j++) faces.push(i + j);
  for (const f of faces) dist.push(Math.floor(Math.max(0, f + flat) * mult));
  const min = Math.min(...dist), max = Math.max(...dist), avg = dist.reduce((a, b) => a + b, 0) / dist.length;
  const ko = dist.filter((x) => x >= def.hp).length / dist.length;
  return { hitPct: hit / 20, need: Math.max(1, need), min, max, avg, koPct: (hit / 20) * ko, mult, die, dice, flat };
}

/* ---------- end of round ---------- */
function endOfRound(B) {
  const msgs = [];
  const w = weatherOn(B);
  for (const f of allActive(B)) {
    if (f.fainted) continue;
    const a = fx(f), it = ifx(f);
    const lose = (n, why) => { if (n <= 0) return; f.hp = Math.max(0, f.hp - n); f.taken += n; msgs.push(`${f.name} takes ${n} from ${why}.`); if (f.hp === 0) { f.fainted = true; msgs.push(`${f.name} fainted.`); } };
    const gain = (n, why) => { if (n <= 0 || f.vol["Heal Block"]) return; const h = Math.min(n, f.maxHp - f.hp); if (h > 0) { f.hp += h; msgs.push(`${f.name} restores ${h} HP (${why}).`); } };
    const indirect = !a.noIndirect;
    if (indirect && !it.goggles) {
      if (w === "Hail" && !isType(f, "ICE") && !(a.noWeatherDmg || []).includes("Hail")) lose(1, "Hail");
      if (w === "Sandstorm" && !["ROCK", "GROUND", "STEEL"].some((t) => isType(f, t)) && !(a.noWeatherDmg || []).includes("Sandstorm")) lose(1, "Sandstorm");
    }
    if (["Burn", "Poison", "Frostbite"].includes(f.status)) {
      if (f.status === "Poison" && a.poisonHeal) gain(1, "Poison Heal");
      else if (indirect) lose(1, f.status);
    }
    if (indirect) for (const v of ["Bound", "Curse", "Leech Seed"]) if (f.vol[v]) { lose(1, v); if (v === "Leech Seed") { const other = activeOf(B, foeSide(f.side)).find((x) => !x.fainted); if (other) { const h = Math.min(1, other.maxHp - other.hp); if (h) { other.hp += h; msgs.push(`${other.name} drains 1 HP (Leech Seed).`); } } } }
    if (f.vol.Nightmare && f.status === "Sleep" && indirect) lose(1, "Nightmare");
    if (a.eot) { const v = a.eot(f, B); if (v < 0) lose(-v, f.ability); if (v > 0) gain(v, f.ability); }
    if (it.sludge) { if (isType(f, "POISON")) gain(1, f.item); else lose(1, f.item); }
    if (f.ability === "Ice Body" && w === "Hail" && B.round % 2 === 0) gain(1, "Ice Body");
    if (f.ability === "Rain Dish" && w === "Rain" && B.round % 2 === 0) gain(1, "Rain Dish");
    // count down timed conditions
    if (f.statusTurns > 0 && ["Sleep", "Freeze"].includes(f.status)) { f.statusTurns--; if (f.statusTurns === 0) { msgs.push(`${f.name} is no longer affected by ${f.status}.`); f.status = ""; } }
    for (const v of Object.keys(f.vol)) {
      if (v === "Flinch") { delete f.vol[v]; continue; }
      if (f.vol[v] < 90) { f.vol[v]--; if (f.vol[v] <= 0) { delete f.vol[v]; if (v === "Perish Song") { f.hp = 0; f.fainted = true; msgs.push(`${f.name} fainted from Perish Song.`); } else if (v === "Drowsy") msgs.push(inflict(B, f, "Sleep", "Drowsy")); else msgs.push(`${f.name}'s ${v} wore off.`); } }
    }
    if (f.dmax > 0) { f.dmax--; if (f.dmax === 0) { f.maxHp = Math.round(f.maxHp / 2); f.hp = Math.min(Math.ceil(f.hp / 2), f.maxHp); msgs.push(`${f.name} returns to normal size.`); } }
  }
  // timed weather/terrain from abilities & items
  if (B.weatherTurns > 0) { B.weatherTurns--; if (B.weatherTurns === 0) { B.weather = B.weatherBase; msgs.push(`The weather returns to ${B.weatherBase}.`); } }
  if (B.terrainTurns > 0) { B.terrainTurns--; if (B.terrainTurns === 0) { B.terrain = B.terrainBase; msgs.push(`The terrain returns to ${B.terrainBase}.`); } }
  B.round++;
  return msgs;
}

function onEnter(B, f) {
  const msgs = [];
  if (f.entered) return msgs;
  f.entered = true;
  const a = fx(f), it = ifx(f);
  const e = a.entry || it.entry;
  if (a.noWeather) { B.noWeather = true; msgs.push(`${f.name}'s ${f.ability}: weather has no effect.`); }
  if (e && e.weather && !B.indoor) {
    const extend = allActive(B).some((x) => { const i = ifx(x); return i.extend && e.weather.toLowerCase().startsWith(i.extend.slice(0, 4)); });
    B.weather = e.weather; B.weatherTurns = 5 + (extend ? 2 : 0);
    msgs.push(`${f.name}'s ${a.entry ? f.ability : f.item}: the weather becomes ${e.weather} for ${B.weatherTurns} turns.`);
  }
  if (e && e.terrain) { B.terrain = e.terrain; B.terrainTurns = 5; msgs.push(`${f.name}'s ${a.entry ? f.ability : f.item}: the ground becomes ${e.terrain} Terrain for 5 turns.`); }
  if (a.foeAtkStat) msgs.push(`${f.name}'s Intimidate: opposing Pokémon roll a smaller damage die (−2).`);
  return msgs;
}

/* ---------- catching ---------- */
const BALL_RULES = {
  "Dive Ball": (c) => (isType(c.t, "WATER") ? 4 : 0), "Lure Ball": (c) => (isType(c.t, "WATER") ? 4 : 0),
  "Net Ball": (c) => (isType(c.t, "WATER") || isType(c.t, "BUG") ? 4 : 0), "Sport Ball": (c) => (isType(c.t, "BUG") ? 4 : 0),
  "Nest Ball": (c) => (c.t.bst <= 20 ? 4 : 0), "Heavy Ball": (c) => (c.t.bst >= 30 ? 4 : 0),
  "Quick Ball": (c) => (isType(c.t, "FLYING") || c.round === 5 ? 6 : 0), "Timer Ball": (c) => (c.round > 5 ? 6 : 0), "Fast Ball": (c) => (c.round === 5 ? 4 : 0),
  "Repeat Ball": (c) => (S.mons.some((m) => dkey(m.sp) === dkey(c.t.sp)) ? 4 : 0),
  "Level Ball": (c) => (c.me && c.t.bst <= c.me.bst - 10 ? 4 : 0),
  "Love Ball": (c) => (c.me && c.me.gender && c.t.gender && c.me.gender !== c.t.gender ? 4 : 0),
  "Moon Ball": (c) => (evolutionsOf(c.t.sp).some((e) => /Moon Stone/i.test(e.evoMethod)) ? 4 : 0),
  "Dusk Ball": (c) => (c.dark ? 4 : 0),
};
function ballMod(name, ctx) {
  const it = itemFind(name);
  if (!it) return { v: 0, notes: [] };
  if (/without fail/i.test(it.desc)) return { v: 999, master: true, notes: ["Master Ball never fails"] };
  const m = it.desc.match(/^[^+]*?([+-]\d+) Catch Modifier\.?(?!\s*when)/);
  let v = m ? +m[1] : 0;
  const notes = [];
  if (m) notes.push(`${name} ${m[1]}`);
  if (BALL_RULES[name]) { const b = BALL_RULES[name](ctx); if (b) { v += b; notes.push(`${name} bonus +${b}`); } }
  return { v, notes };
}
function ballFriendship(name) { const it = itemFind(name); const m = it && it.desc.match(/\+(\d) to Friendship Level/); return m ? +m[1] : 0; }

/* ---------------- Map ---------------- */
function reqStatus(ev) {
  const q = ev.q || {}, lv = level(), rb = ribbonCount();
  const check = (g, v) => {
    if (!g) return "now";
    if (g.set) { if (g.set.includes(v)) return "now"; return v < Math.max(...g.set) ? "later" : "missed"; }
    if (g.min != null && v < g.min) return "later";
    if (g.max != null && v > g.max) return "missed";
    return "now";
  };
  let st = check(q.badges, lv);
  if (st === "now" && q.ribbons) st = check(q.ribbons, rb);
  if (st === "now" && q.eachType && hasRibbonTypes().size < 5) st = "later";
  if (st === "now" && q.cond) st = "special";
  return st;
}
function eventKey(loc, ev) { return loc + "|" + ev.t + "|" + (ev.r || ""); }

function evCard(L, x) {
  const e = x.e;
  const cls = { now: "now", special: "special", later: "later", missed: "missed", done: "done" }[x.st];
  let fights = L.tr.filter((t) => t.e && (t.e === e.t || e.t.includes(t.e) || t.e.includes(e.t)));
  if (/ Gym$/.test(e.t)) fights = L.tr.filter((t) => /^Gym Leader/.test(t.n));
  if (/^The Battle \w+$/.test(e.t)) fights = L.tr.filter((t) => /^Frontier Brain/.test(t.n));
  const contest = e.t.match(/^(Beauty|Cool|Cute|Clever|Tough) Contest$/);
  const hall = contest && HALLS.find((h) => h.town === L.n);
  const hallWon = hall && S.awards[hall.id] && S.awards[hall.id].on;

    <div class="stack">
